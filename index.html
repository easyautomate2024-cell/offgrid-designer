<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オフグリッド電気設計ツール</title>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f1f5f9;color:#1e293b;height:100vh;overflow:hidden;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#root{height:100vh;display:flex;flex-direction:column}
.hdr{background:#0f172a;color:white;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.hdr-title{font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
.hdr-sub{font-size:10px;color:#64748b;margin-top:1px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.btn{padding:5px 11px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.15s;white-space:nowrap;line-height:1.4}
.btn-primary{background:#3b82f6;color:white}.btn-primary:hover{background:#2563eb}
.btn-success{background:#22c55e;color:white}.btn-success:hover{background:#16a34a}
.btn-check{background:#8b5cf6;color:white}.btn-check:hover{background:#7c3aed}
.btn-outline{background:transparent;color:#cbd5e1;border:1px solid rgba(255,255,255,.2)}.btn-outline:hover{background:rgba(255,255,255,.1)}
.btn-ghost{background:transparent;color:#64748b;border:1px solid #e2e8f0}.btn-ghost:hover{background:#f8fafc}
.btn-danger{background:#ef4444;color:white}.btn-danger:hover{background:#dc2626}
.btn-warn{background:#f59e0b;color:white}.btn-warn:hover{background:#d97706}
.btn-sm{padding:3px 8px;font-size:11px}
.volt-sel{padding:4px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:white;font-size:12px;cursor:pointer}
.volt-sel option{background:#1e293b}
.vlbl{font-size:10px;color:#94a3b8}
.body{display:flex;flex:1;overflow:hidden;position:relative}
/* Palette */
.pal{width:148px;background:white;border-right:1px solid #e2e8f0;overflow-y:auto;flex-shrink:0;padding:7px}
.pal-cat{font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.8px;padding:0 2px;margin-bottom:4px}
.pal-sec{margin-bottom:9px}
.pal-item{padding:6px;border-radius:6px;border:1.5px solid #e2e8f0;margin-bottom:3px;cursor:grab;user-select:none;display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:500;transition:.13s;background:white}
.pal-item:hover{border-color:#3b82f6;background:#eff6ff;box-shadow:0 0 0 2px rgba(59,130,246,.12)}
.pal-item:active{cursor:grabbing}
.p-ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
/* Canvas */
.cvs-wrap{flex:1;overflow:hidden;position:relative;background:#f8fafc}
.cvs-bg{position:absolute;inset:0;background-image:radial-gradient(circle,#cbd5e1 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
.cvs-svg{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible}
.cvs-nodes{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.cvs-handles{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
/* Node */
.nd{position:absolute;border-radius:8px;border:2px solid;pointer-events:all;user-select:none}
.nd.sel{outline:3px solid #3b82f6;outline-offset:2px;z-index:50}
.nd.port-edit-mode{outline:3px solid #f59e0b;outline-offset:2px;z-index:50}
.nd-body{padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:6px;cursor:move;position:relative;width:100%;height:100%;justify-content:center}
.nd-ico{font-size:19px;line-height:1}
.nd-ico img{width:28px;height:28px;object-fit:contain}
.nd-lbl{font-size:10px;font-weight:700;text-align:center;line-height:1.2;white-space:nowrap}
.nd-name{font-size:9px;color:#64748b;text-align:center;white-space:normal;max-width:120px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.3}
.nd-spec{font-size:10px;font-weight:700;text-align:center;margin-top:1px}
.nd-del{position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:white;border:2px solid white;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:60}
.nd-del:hover{background:#dc2626}
.nd-resize{position:absolute;bottom:0;right:0;width:16px;height:16px;cursor:nwse-resize;z-index:65;border-radius:0 0 6px 0}
.nd-resize::after{content:'';position:absolute;bottom:3px;right:3px;width:0;height:0;border-style:solid;border-width:0 0 9px 9px;border-color:transparent transparent #94a3b8 transparent}
.nd-resize:hover::after{border-color:transparent transparent #3b82f6 transparent}
.port-edit-badge{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:#f59e0b;color:white;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:70}
/* Ports */
.port{position:absolute;width:13px;height:13px;border-radius:50%;border:2px solid white;cursor:crosshair;z-index:20;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.2);transition:.1s}
.port:hover{transform:translate(-50%,-50%) scale(1.5);box-shadow:0 0 0 3px rgba(59,130,246,.45)}
.port.drawing-src{transform:translate(-50%,-50%) scale(1.5);box-shadow:0 0 0 4px rgba(251,191,36,.6)}
.port.can-target{animation:portPulse .75s infinite}
.port.edit-mode{cursor:move !important;box-shadow:0 0 0 3px rgba(245,158,11,.5)}
.port-lbl{position:absolute;font-size:8px;font-weight:700;color:#475569;pointer-events:none;user-select:none;z-index:21;white-space:nowrap}
@keyframes portPulse{0%,100%{box-shadow:0 0 0 2px rgba(34,197,94,.5)}50%{box-shadow:0 0 0 7px rgba(34,197,94,.12)}}
@keyframes wireBlink{0%,100%{opacity:1}50%{opacity:.35}}
.wire-warn{animation:wireBlink 1s ease-in-out infinite}
@keyframes wireHaloPulse{0%,100%{stroke-opacity:.15}50%{stroke-opacity:.45}}
.wire-warn-halo{animation:wireHaloPulse 1s ease-in-out infinite}
/* Waypoint handles */
.wp-handle{position:absolute;width:16px;height:16px;background:white;border:2px solid #3b82f6;border-radius:3px;transform:translate(-50%,-50%) rotate(45deg);cursor:move;pointer-events:all;z-index:82;transition:.1s}
.wp-handle:hover{background:#eff6ff;border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(59,130,246,.25)}
.add-wp{position:absolute;width:14px;height:14px;border-radius:50%;background:white;border:2px solid #64748b;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#64748b;cursor:pointer;pointer-events:all;z-index:81;transform:translate(-50%,-50%);transition:.13s;line-height:1;opacity:.7}
.add-wp:hover{opacity:1;border-color:#3b82f6;color:#3b82f6;transform:translate(-50%,-50%) scale(1.2)}
.port-ghost{position:absolute;width:14px;height:14px;border-radius:50%;border:2.5px dashed white;transform:translate(-50%,-50%);pointer-events:none;z-index:100;animation:ghostPulse .5s infinite}
@keyframes ghostPulse{0%,100%{box-shadow:0 0 0 3px rgba(245,158,11,.6)}50%{box-shadow:0 0 0 7px rgba(245,158,11,.1)}}
.edge-hl{position:absolute;background:rgba(245,158,11,.45);border-radius:2px;pointer-events:none;z-index:99}
/* Right panel */
.rpanel{width:260px;background:white;border-left:1px solid #e2e8f0;overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column}
.psec{padding:13px;border-bottom:1px solid #f1f5f9}
.ptitle{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.4px;margin-bottom:9px}
.prow{margin-bottom:7px}
.plbl{font-size:10.5px;color:#94a3b8;font-weight:500;margin-bottom:2px}
.pinput,.psel{width:100%;padding:6px 8px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;background:white}
.pinput:focus,.psel:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.1)}
.row2{display:flex;gap:6px}.row2 .prow{flex:1}
/* Color swatches */
.color-row{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.cswatch{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2.5px solid transparent;transition:.1s;flex-shrink:0}
.cswatch.active{border-color:#0f172a;transform:scale(1.2)}
.cswatch:hover:not(.active){border-color:#94a3b8;transform:scale(1.1)}
/* Thickness slider */
.thick-row{display:flex;align-items:center;gap:8px}
.thick-slider{flex:1;accent-color:#3b82f6}
.thick-val{font-size:11px;font-weight:700;color:#1d4ed8;min-width:28px;text-align:right}
/* Gauge card */
.gc{background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:11px;margin-top:6px}
.gc-big{font-size:21px;font-weight:800;color:#0369a1}
.gc-row{display:flex;justify-content:space-between;font-size:11px;color:#0891b2;margin-top:2px}
.gc-warn{background:#fef9c3;border:1px solid #fde047;border-radius:6px;padding:7px;font-size:10.5px;color:#854d0e;margin-top:5px}
.fc{background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:9px;margin-top:6px}
.fc-big{font-size:17px;font-weight:800;color:#c2410c}
.wg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.wg-field label{font-size:10px;color:#94a3b8;display:block;margin-bottom:2px}
.wg-field input{width:100%;padding:5px 7px;border:1px solid #e2e8f0;border-radius:5px;font-size:12px}
/* BOM Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:white;border-radius:12px;width:100%;max-width:860px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 25px 60px rgba(0,0,0,.3)}
.mhd{padding:14px 18px;border-bottom:1px solid #f1f5f9;display:flex;align-items:center;gap:10px;flex-shrink:0}
.mttl{font-size:15px;font-weight:700;flex:1}
.mbody{flex:1;overflow-y:auto;padding:18px}
.mfoot{padding:12px 18px;border-top:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;gap:8px;flex-wrap:wrap}
/* 設計レビュー: タブ */
.rev-tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
.rev-tab{border:none;background:transparent;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:#64748b;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:5px}
.rev-tab:hover{background:#f1f5f9}
.rev-tab.on{background:#eef2ff;color:#4338ca}
.rev-badge{background:#f59e0b;color:#fff;border-radius:999px;padding:0 6px;font-size:10.5px;font-weight:700;line-height:16px;min-width:16px;text-align:center}
.rev-badge.err{background:#ef4444}
/* ファイルメニュー */
.file-menu-wrap{position:relative}
.file-menu-catch{position:fixed;inset:0;z-index:180}
.file-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:190;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);min-width:190px;padding:6px;display:flex;flex-direction:column}
.file-menu button,.file-menu label{display:block;width:100%;text-align:left;border:none;background:transparent;padding:9px 12px;font-size:13px;color:#0f172a;border-radius:7px;cursor:pointer;font-weight:500}
.file-menu button:hover,.file-menu label:hover{background:#f1f5f9}
.file-menu-sep{height:1px;background:#f1f5f9;margin:5px 4px}
.bom-tbl{width:100%;border-collapse:collapse}
.bom-tbl th{background:#f8fafc;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.4px;padding:7px 11px;text-align:left;border-bottom:2px solid #e2e8f0;white-space:nowrap}
.bom-tbl td{padding:9px 11px;border-bottom:1px solid #f1f5f9;font-size:12.5px;vertical-align:middle}
.bom-tbl tr:last-child td{border-bottom:none}
.bom-tbl tbody tr:hover td{background:#f8fafc}
.aff-link{display:inline-flex;align-items:center;gap:3px;color:#3b82f6;text-decoration:none;font-size:11.5px;padding:3px 9px;border-radius:5px;background:#eff6ff;border:1px solid #bfdbfe;font-weight:500}
.aff-link:hover{background:#dbeafe}
/* Amazon CTA – オレンジで購買意欲を喚起 */
.aff-primary{display:inline-flex;flex-direction:column;align-items:flex-start;gap:1px;text-decoration:none;background:linear-gradient(180deg,#ffd874 0%,#f0a93c 60%,#dd8c1a 100%);color:#0f172a;font-weight:700;padding:6px 11px;border-radius:6px;border:1px solid #c8851a;box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 1px 2px rgba(0,0,0,.15);transition:.12s;min-width:118px}
.aff-primary:hover{background:linear-gradient(180deg,#ffe089 0%,#f4b54f 60%,#e89622 100%);transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 3px 6px rgba(0,0,0,.18)}
.aff-primary .pri-top{font-size:12px;line-height:1.2;display:flex;align-items:center;gap:4px}
.aff-primary .pri-sub{font-size:9.5px;color:#7c2d12;font-weight:600;line-height:1.2}
.aff-alts{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.aff-alt{font-size:9.5px;color:#64748b;text-decoration:none;padding:2px 6px;border:1px solid #e2e8f0;border-radius:3px;background:#f8fafc;white-space:nowrap;font-weight:500}
.aff-alt:hover{color:#dd8c1a;border-color:#f0a93c;background:#fef3c7}
.prime-badge{display:inline-block;font-size:9px;font-weight:700;color:#0066c0;background:#fff;border:1px solid #0066c0;padding:1px 4px;border-radius:3px;margin-left:4px;line-height:1.1}
.aff-bulk{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(180deg,#ffd874,#dd8c1a);color:#0f172a;font-weight:700;padding:8px 16px;border-radius:8px;border:1px solid #c8851a;text-decoration:none;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.aff-bulk:hover{background:linear-gradient(180deg,#ffe089,#e89622);transform:translateY(-1px)}
.subtotal-cell{font-weight:700;color:#0f172a;font-size:13px}
.subtotal-cell .qty-x{color:#64748b;font-weight:500;font-size:11px;margin-right:3px}
/* Check Modal */
.check-summary{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;font-weight:700}
.cs-ok{background:#f0fdf4;border:1.5px solid #86efac;color:#166534}
.cs-warn{background:#fefce8;border:1.5px solid #fde047;color:#854d0e}
.cs-err{background:#fef2f2;border:1.5px solid #fca5a5;color:#991b1b}
.chk-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:6px;border:1px solid}
.chk-ok{background:#f0fdf4;border-color:#bbf7d0}
.chk-warn{background:#fefce8;border-color:#fde047}
.chk-err{background:#fef2f2;border-color:#fecaca}
.chk-info{background:#f0f9ff;border-color:#bae6fd}
.chk-icon{font-size:16px;flex-shrink:0;line-height:1.4}
.chk-title{font-size:12.5px;font-weight:600;line-height:1.4}
.chk-details{margin-top:4px}
.chk-detail-row{font-size:11px;color:#64748b;padding:1px 0;line-height:1.5}
.chk-cat{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:#94a3b8;margin:12px 0 5px;padding-left:2px}
/* Simulation Modal */
.sim-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:10px}
.sim-card-title{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.sim-big{font-size:28px;font-weight:800;line-height:1}
.sim-unit{font-size:13px;font-weight:600;color:#64748b;margin-left:3px}
.sim-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:12px}
.sim-row:last-child{border-bottom:none}
.sim-row .lbl{color:#64748b}
.sim-row .val{font-weight:700;color:#0f172a}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sim-load-row{display:grid;grid-template-columns:1fr 70px 60px 80px;gap:8px;align-items:center;padding:6px;border-bottom:1px solid #f1f5f9;font-size:12px}
.sim-load-row:last-child{border-bottom:none}
.sim-load-row input{width:100%;padding:4px 6px;border:1px solid #e2e8f0;border-radius:4px;font-size:12px;text-align:right}
.sim-hours-range{flex:1;accent-color:#3b82f6}
.sim-stat{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px;border-radius:10px;text-align:center}
.sim-stat-val{font-size:24px;font-weight:800;line-height:1}
.sim-stat-lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-top:4px;opacity:.8}
.sim-stat-good{background:#dcfce7;color:#166534}
.sim-stat-warn{background:#fef9c3;color:#854d0e}
.sim-stat-bad{background:#fee2e2;color:#991b1b}
.sim-stat-info{background:#dbeafe;color:#1e40af}
.sim-bar{height:8px;border-radius:4px;background:#e2e8f0;overflow:hidden;margin-top:4px}
.sim-bar-fill{height:100%;transition:width .3s}
/* Settings */
.srow{margin-bottom:12px}
.slbl{font-size:13px;font-weight:600;margin-bottom:3px}
.sdesc{font-size:11px;color:#94a3b8;margin-bottom:5px}
.sinput{width:100%;padding:7px 11px;border:1px solid #e2e8f0;border-radius:8px;font-size:13px}
.empty{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#94a3b8;pointer-events:auto;max-width:90%}
.sample-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:18px;max-width:560px}
.sample-card{background:white;border:1px solid #e2e8f0;border-radius:12px;padding:14px;cursor:pointer;text-align:left;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sample-card:hover{border-color:#3b82f6;box-shadow:0 4px 12px rgba(59,130,246,.15);transform:translateY(-1px)}
.sample-card-title{font-size:13.5px;font-weight:700;color:#0f172a;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.sample-card-desc{font-size:11px;color:#64748b;line-height:1.5}
.sample-card-spec{font-size:10px;color:#0891b2;margin-top:6px;font-weight:600}
.empty-ico{font-size:50px;opacity:.3;margin-bottom:10px}
.empty-t{font-size:15px;font-weight:600;margin-bottom:5px}
.empty-s{font-size:12.5px;line-height:1.7}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:white;padding:9px 18px;border-radius:8px;font-size:12.5px;z-index:400;pointer-events:none;animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* タッチデバイスでのスクロール抑制（ノードドラッグ中） */
.nd,.port,.wp-handle{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cvs-wrap{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cvs-svg,.cvs-nodes,.cvs-handles{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* モバイル用切替ボタン */
.mobile-toggle{display:none;position:absolute;top:8px;z-index:200;background:white;border:1px solid #e2e8f0;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;color:#0f172a;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.mobile-toggle.pal-tog{left:8px}
.mobile-toggle.pan-tog{right:8px}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150}

<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ═══════════════════════════════════════════════════════════════
//  Constants
// ═══════════════════════════════════════════════════════════════
// 許容電流: KIV (JIS C 3306) 空中単線・周囲温度40℃基準
const WIRE_SIZES = [
  {mm2:0.75,awg:18,   maxA:15,  label:'0.75mm²'},
  {mm2:1.25,awg:16,   maxA:20,  label:'1.25mm²'},
  {mm2:2,   awg:14,   maxA:27,  label:'2mm²'},
  {mm2:3.5, awg:12,   maxA:37,  label:'3.5mm²'},
  {mm2:5.5, awg:10,   maxA:49,  label:'5.5mm²'},
  {mm2:8,   awg:8,    maxA:61,  label:'8mm²'},
  {mm2:14,  awg:6,    maxA:88,  label:'14mm²'},
  {mm2:22,  awg:4,    maxA:115, label:'22mm²'},
  {mm2:38,  awg:2,    maxA:162, label:'38mm²'},
  {mm2:60,  awg:'1/0',maxA:220, label:'60mm²'},
  {mm2:100, awg:'3/0',maxA:298, label:'100mm²'},
];
const FUSE_STD=[5,10,15,20,25,30,40,50,60,80,100,125,150,200,250,300,400,500];

// Wire preset colors
const WIRE_COLORS=[
  {color:'#ef4444',name:'赤（+極）'},
  {color:'#1e293b',name:'黒（−極）'},
  {color:'#3b82f6',name:'青（AC）'},
  {color:'#f97316',name:'橙'},
  {color:'#eab308',name:'黄'},
  {color:'#22c55e',name:'緑'},
  {color:'#7c3aed',name:'紫'},
  {color:'#94a3b8',name:'グレー'},
  {color:'#f8fafc',name:'白'},
];

function calcWire(a,l,v){
  if(!a||!l||!v) return null;
  const s=(2*l*a)/(56*v*.03);
  return WIRE_SIZES.find(w=>w.mm2>=s&&w.maxA>=a)||WIRE_SIZES[WIRE_SIZES.length-1];
}
function suggestFuse(a){ return FUSE_STD.find(r=>r>=a*1.25)||500; }

// ポートに流れる予想電流（A）。両端の機器仕様から導出。安全余裕1.25倍を含む。
function expectedCurrentAt(node,portId){
  if(!node) return null;
  const p=node.props||{};
  switch(node.type){
    case'solar_panel':
      // Isc × 1.25（NEC基準）。なければ watts/voc から推定
      if(p.isc) return p.isc*1.25;
      if(p.watts&&p.voc) return (p.watts/p.voc)*1.25;
      return null;
    case'inverter':
      if(portId==='dc_pos'||portId==='dc_neg'){
        // DC入力 = 連続出力W / 入力V / 効率(0.85) × 安全1.25
        const w=p.watts||0, v=p.inputV||12;
        return v>0?(w/v/0.85)*1.25:null;
      } else if(portId==='ac'){
        return (p.watts||0)/100;
      }
      return null;
    case'mppt': case'pwm':
      // 太陽光側・バッテリー側・負荷側いずれも最大電流
      return (p.maxA||0)*1.25;
    case'dc_dc':
      // 入出力どちらも最大電流（実効はもう少し低いが安全側）
      return (p.maxA||0)*1.25;
    case'charger':
      return (p.maxA||0)*1.25;
    case'fuse': case'breaker': case'switch':
      return p.amps||null;
    case'dc_load':
      { const v=p.voltage||12; return v>0?(p.watts||0)/v:null; }
    case'ac_load':
      return (p.watts||0)/100;
    case'shore_power':
    case'battery':
    case'bus_pos':
    case'bus_neg':
    case'bus_bar':
      return null; // 反対側のポート電流に従う、またはネットワーク集計
  }
  return null;
}
// バスバー経由の場合、そこに集約される他配線の電流を合計
// excludeConnId: 自分自身の配線ID（合計対象から除外）
function sumBusBarCurrent(busNode,conns,nodes,excludeConnId=null){
  if(!busNode) return 0;
  if(busNode.type!=='bus_pos'&&busNode.type!=='bus_neg') return 0;
  let total=0;
  for(const c of conns){
    if(c.id===excludeConnId) continue;
    const isFrom=c.fromNode===busNode.id, isTo=c.toNode===busNode.id;
    if(!isFrom&&!isTo) continue;
    const otherId=isFrom?c.toNode:c.fromNode;
    const otherPort=isFrom?c.toPort:c.fromPort;
    const otherNode=nodes.find(n=>n.id===otherId);
    if(!otherNode) continue;
    // 反対端がバスバーの場合は再帰せず、その配線の amps を信用
    if(otherNode.type==='bus_pos'||otherNode.type==='bus_neg'){
      const a=+c.amps||0; total+=a;
    } else {
      const curr=expectedCurrentAt(otherNode,otherPort);
      if(curr) total+=curr;
      else if(c.amps) total+=+c.amps; // 明示的に設定されていれば使う
    }
  }
  return total;
}
// 保護デバイス（fuse/switch/breaker）を「通過電流」で評価するため、反対端子側の先を辿る
// 終点で bus が見つかればその集計、他機器なら expectedCurrentAt を返す。チェーンも再帰追跡。
function traceThroughProtection(node,portId,conns,nodes,visited){
  if(!node) return null;
  const isProt=node.type==='fuse'||node.type==='switch'||node.type==='breaker';
  if(!isProt) return null;
  const otherPort=portId==='in'?'out':(portId==='out'?'in':null);
  if(!otherPort) return null;
  for(const c of conns){
    if(visited.has(c.id)) continue;
    let beyondId,beyondPort;
    if(c.fromNode===node.id&&c.fromPort===otherPort){beyondId=c.toNode;beyondPort=c.toPort;}
    else if(c.toNode===node.id&&c.toPort===otherPort){beyondId=c.fromNode;beyondPort=c.fromPort;}
    else continue;
    const beyond=nodes.find(n=>n.id===beyondId); if(!beyond) continue;
    visited.add(c.id);
    if(beyond.type==='bus_pos'||beyond.type==='bus_neg'||beyond.type==='bus_bar'){
      return sumBusBarCurrent(beyond,conns,nodes,c.id);
    }
    if(beyond.type==='fuse'||beyond.type==='switch'||beyond.type==='breaker'){
      return traceThroughProtection(beyond,beyondPort,conns,nodes,visited);
    }
    return expectedCurrentAt(beyond,beyondPort);
  }
  return null;
}
// 配線全体の予想電流（バスバー考慮版）。両端から取得し、null 同士ならバスバー側の他配線を合計
function calcWireAmps(fromN,fromPortId,toN,toPortId,conns,nodes,excludeConnId=null){
  // 保護デバイスは「通過する電流」を辿って取得（定格 amps ではなく実電流）
  // トレースが失敗（電源側で終端）した場合は null のまま → バスバー側のフォールバックに任せる
  const isProtF=fromN&&(fromN.type==='fuse'||fromN.type==='switch'||fromN.type==='breaker');
  const isProtT=toN&&(toN.type==='fuse'||toN.type==='switch'||toN.type==='breaker');
  let aF, aT;
  if(isProtF){
    const v=new Set(); if(excludeConnId) v.add(excludeConnId);
    aF=traceThroughProtection(fromN,fromPortId,conns,nodes,v);
  } else aF=expectedCurrentAt(fromN,fromPortId);
  if(isProtT){
    const v=new Set(); if(excludeConnId) v.add(excludeConnId);
    aT=traceThroughProtection(toN,toPortId,conns,nodes,v);
  } else aT=expectedCurrentAt(toN,toPortId);
  if(aF!=null||aT!=null) return Math.max(aF||0,aT||0);
  // 両端不明 → バスバーの他配線を合計
  const fromIsBus=fromN&&(fromN.type==='bus_pos'||fromN.type==='bus_neg');
  const toIsBus=toN&&(toN.type==='bus_pos'||toN.type==='bus_neg');
  const busNode=fromIsBus?fromN:(toIsBus?toN:null);
  if(busNode) return sumBusBarCurrent(busNode,conns,nodes,excludeConnId);
  // 最終フォールバック: 保護デバイスの定格 amps
  if(isProtF) return +(fromN.props?.amps)||0;
  if(isProtT) return +(toN.props?.amps)||0;
  return 0;
}
// 2ポート間のおおよその配線長(m)。ピクセル距離 100px=1m を目安、最小1m。
// スケール: 機器寸法と同じ 1cm = 10px → 1m = 1000px
const PX_PER_M=1000;
function estimateWireLengthM(p1,p2){
  if(!p1||!p2) return 0.5;
  const dx=p1.x-p2.x, dy=p1.y-p2.y;
  const px=Math.hypot(dx,dy);
  // 0.1m単位で丸め、最低0.3m
  const m=Math.max(0.3,Math.round(px/PX_PER_M*10)/10);
  return m;
}
// 実際の描画経路のセグメント配列から配線長(m)を計算。1m=1000px (10px/cm), 0.1m単位丸め, 最低0.3m。
function pathLengthM(segs){
  if(!segs||!segs.length) return 0.3;
  let total=0;
  for(const s of segs) total+=Math.hypot(s.bx-s.ax,s.by-s.ay);
  return Math.max(0.3,Math.round(total/PX_PER_M*10)/10);
}
// 配線の電圧コンテキスト(DC系統電圧 or AC100V)を判定
function wireVoltage(conn,nodes,systemV){
  const ports=[
    {n:nodes.find(n=>n.id===conn.fromNode),pid:conn.fromPort},
    {n:nodes.find(n=>n.id===conn.toNode),pid:conn.toPort},
  ];
  for(const{n,pid}of ports){
    if(!n) continue;
    // インバーターの AC ポート or AC負荷 → 100V
    if(n.type==='inverter'&&pid==='ac') return 100;
    if(n.type==='ac_load') return 100;
    if(n.type==='shore_power') return 100;
  }
  return systemV;
}
// 配線の派生値を一括計算。上書き(空でない conn.amps/lenM/wireSize)があればそれを優先。
// segs が無ければ amps/wireSize は派生できるが lenM は override か 1m フォールバック。
function getDerivedWire(conn,nodes,conns,systemV,segs=null){
  const fromN=nodes.find(n=>n.id===conn.fromNode);
  const toN  =nodes.find(n=>n.id===conn.toNode);
  // 長さ
  const lenAuto=segs?pathLengthM(segs):1;
  const lenManual=conn.lenM!=null&&conn.lenM!==''?+conn.lenM:null;
  const lenM=lenManual!=null&&isFinite(lenManual)&&lenManual>0?lenManual:lenAuto;
  const lenIsAuto=lenManual==null;
  // 電流
  const ampsAuto=Math.ceil(calcWireAmps(fromN,conn.fromPort,toN,conn.toPort,conns,nodes,conn.id)||0);
  const ampsManual=conn.amps!=null&&conn.amps!==''?+conn.amps:null;
  const amps=ampsManual!=null&&isFinite(ampsManual)&&ampsManual>0?ampsManual:ampsAuto;
  const ampsIsAuto=ampsManual==null;
  // サイズ（AC側は 100V で計算 → 電流が小さく結果として細い線になる）
  const v=wireVoltage(conn,nodes,systemV);
  const sizeRes=amps>0&&lenM>0?calcWire(amps,lenM,v):null;
  const sizeAuto=sizeRes?sizeRes.label:'';
  const sizeManual=conn.wireSize||'';
  const wireSize=sizeManual||sizeAuto;
  const sizeIsAuto=!sizeManual;
  return{amps,lenM,wireSize,lenAuto,ampsAuto,sizeAuto,lenIsAuto,ampsIsAuto,sizeIsAuto,sizeRes};
}
// ポートIDから極性とペアキーを抽出
// 'bat_pos' → {pol:'pos', key:'bat'},  'pos' → {pol:'pos', key:''},  'ac_out' → null
function portPolarityInfo(portId){
  if(!portId) return null;
  if(portId==='pos') return{pol:'pos',key:''};
  if(portId==='neg') return{pol:'neg',key:''};
  let m=portId.match(/^(.*)_pos$/);
  if(m) return{pol:'pos',key:m[1]};
  m=portId.match(/^(.*)_neg$/);
  if(m) return{pol:'neg',key:m[1]};
  return null;
}
// 同じノードを共有し、同じペアキー × 反対極性のポートに繋がる配線を返す
// 例: MPPT B+ → bus_pos の partner は MPPT B- → bus_neg（MPPT を共有, bat_pos/bat_neg）
function findPairPartner(conn,conns,nodes){
  for(const side of['from','to']){
    const myNode=conn[side+'Node'];
    const myPort=conn[side+'Port'];
    const info=portPolarityInfo(myPort); if(!info) continue;
    const oppPol=info.pol==='pos'?'neg':'pos';
    for(const c of conns){
      if(c.id===conn.id) continue;
      // c の from / to のいずれかが myNode で、同じキー × 反対極性
      if(c.fromNode===myNode){
        const ci=portPolarityInfo(c.fromPort);
        if(ci&&ci.key===info.key&&ci.pol===oppPol) return c;
      }
      if(c.toNode===myNode){
        const ci=portPolarityInfo(c.toPort);
        if(ci&&ci.key===info.key&&ci.pol===oppPol) return c;
      }
    }
  }
  return null;
}
// 派生値配列にペア同期を適用。両端とも自動の時のみ、大きい方に揃える。
// wireData: [{c, derived, segs, ...}] の配列
function applyPolaritySync(wireData,nodes,connections,systemV){
  const byId=new Map(wireData.map(w=>[w.c.id,w]));
  for(const w of wireData){
    const partner=findPairPartner(w.c,connections,nodes);
    if(!partner) continue;
    const pw=byId.get(partner.id); if(!pw) continue;
    // 両方とも auto の時のみ同期（どちらかが上書きなら尊重）
    if(!w.derived.sizeIsAuto||!pw.derived.sizeIsAuto) continue;
    const myMm2=WIRE_SIZES.find(s=>s.label===w.derived.wireSize)?.mm2||0;
    const prMm2=WIRE_SIZES.find(s=>s.label===pw.derived.wireSize)?.mm2||0;
    if(prMm2>myMm2){
      // 自分のサイズを partner に揃える
      w.derived={...w.derived,wireSize:pw.derived.wireSize,sizeRes:pw.derived.sizeRes,paired:true};
    } else if(myMm2>prMm2){
      // 同期で「太い方に合わせた」マーク
      w.derived={...w.derived,paired:true};
    } else {
      w.derived={...w.derived,paired:true};
    }
  }
  return wireData;
}

// Visual thickness from wire gauge mm²
function wireThick(wireSize){
  const w=WIRE_SIZES.find(w=>w.label===wireSize); if(!w) return 2.5;
  if(w.mm2<=0.75) return 2; if(w.mm2<=1.25) return 2.5; if(w.mm2<=2) return 3;
  if(w.mm2<=3.5) return 4;  if(w.mm2<=5.5) return 5;    if(w.mm2<=8) return 6.5;
  if(w.mm2<=14) return 8;   if(w.mm2<=22) return 10;    if(w.mm2<=38) return 12;
  if(w.mm2<=60) return 14;  return 17;
}

const COMP = {
  solar_panel:{label:'ソーラーパネル',cat:'発電',icon:'☀',color:'#d97706',bg:'#fef9c3',w:130,h:78,
    defaultProps:{name:'ソーラーパネル',watts:200,voc:24.3,isc:8.7},
    ports:[{id:'pos',label:'+',px:130,py:22,color:'#ef4444'},{id:'neg',label:'-',px:130,py:56,color:'#374151'}],
    affKey:'solar_panel',priceEst:18000,amazonQ:'ソーラーパネル 200W 単結晶'},
  shore_power:{label:'外部電源(陸電)',cat:'発電',icon:'🏠',color:'#65a30d',bg:'#ecfccb',w:118,h:66,
    defaultProps:{name:'外部電源',voltage:100},
    ports:[{id:'ac_out',label:'AC',px:118,py:33,color:'#6366f1'}],
    affKey:null,priceEst:0,amazonQ:''},
  battery:{label:'バッテリー',cat:'蓄電',icon:'🔋',color:'#16a34a',bg:'#dcfce7',w:134,h:82,
    defaultProps:{name:'バッテリー',voltage:12,ah:100,type:'LiFePO4'},
    ports:[{id:'pos',label:'+',px:134,py:22,color:'#ef4444'},{id:'neg',label:'-',px:134,py:60,color:'#374151'}],
    affKey:'battery',priceEst:45000,amazonQ:'LiFePO4 バッテリー 12V 100Ah'},
  mppt:{label:'MPPTコントローラー',cat:'制御',icon:'⚡',color:'#1d4ed8',bg:'#dbeafe',w:158,h:132,
    defaultProps:{name:'MPPTコントローラー',maxA:40,maxVoltage:100},

//   独自画像を使いたい場合は、PHOTO_URLS の対応する type に画像 URL を追加するか、

const PHOTO_URLS={};
// 汎用サムネイル: 写真URL があれば画像、失敗時は色付き絵文字ボックス
function ThumbBox({url,icon,color,bg,label,size=48}){
  const [err,setErr]=React.useState(false);
  React.useEffect(()=>{setErr(false);},[url]);
  if(url&&!err){
    return(<img src={url} alt={label||''} loading="lazy"
      onError={()=>setErr(true)}
      style={{width:size,height:size,objectFit:'cover',background:bg,borderRadius:8,border:`1px solid ${color}33`,flexShrink:0}}/>);
  }
  return(<div style={{width:size,height:size,background:bg,border:`1px solid ${color}33`,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center',fontSize:Math.round(size*0.55),color:color,flexShrink:0}}>{icon}</div>);
}

}

let _gid=1; const uid=()=>String(_gid++);
// ノード/配線読み込み後に uid カウンターを既存IDより大きい値に更新（ID衝突防止）
// nodes だけでなく conns も走査する（旧版は nodes のみ → 新規配線が既存配線IDと衝突する不具合があった）
function bumpGid(nodes,conns){
  const scan=arr=>{
    if(!arr) return 0;
    return arr.reduce((m,x)=>{const v=parseInt(x.id,10);return isNaN(v)?m:Math.max(m,v)},0);
  };
  const mx=Math.max(scan(nodes),scan(conns));
  if(mx>=_gid)_gid=mx+1;
}
// ────────── 共有URL（#d=...） ──────────
// 回路JSONを deflate 圧縮して base64url 化。プレフィックス c=圧縮 / r=無圧縮フォールバック
function _b64uFromBuf(buf){
  const u8=new Uint8Array(buf); let s='';
  for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function _bufFromB64u(s){
  const b=atob(s.replace(/-/g,'+').replace(/_/g,'/'));
  const u8=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)u8[i]=b.charCodeAt(i);
  return u8;
}
async function encodeShareData(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){
    const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();
    return 'c'+_b64uFromBuf(buf);
  }
  return 'r'+_b64uFromBuf(bytes.buffer);
}
async function decodeShareData(s){
  const mode=s[0], u8=_bufFromB64u(s.slice(1));
  if(mode==='c'){
    const buf=await new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer();
    return JSON.parse(new TextDecoder().decode(buf));
  }
  return JSON.parse(new TextDecoder().decode(u8));
}
// 配線IDの衝突を解消（重複していたら新しいIDを割り当て）。元の順序は保持。
function dedupeConnIds(conns){
  if(!conns) return [];
  const seen=new Set();
  const out=[];
  for(const c of conns){
    let id=c.id;
    if(id==null||seen.has(id)){
      // 既存と被らない新IDを生成
      do{ id=uid(); }while(seen.has(id));
    }
    seen.add(id);
    out.push(id===c.id?c:{...c,id});
  }
  return out;
}

function snapToEdge(rawPx,rawPy,w,h){
  const cx=Math.max(0,Math.min(w,rawPx)), cy=Math.max(0,Math.min(h,rawPy));
  const dT=cy,dB=h-cy,dL=cx,dR=w-cx, m=Math.min(dT,dB,dL,dR);
  if(m===dT) return{px:cx,py:0,edge:'top'};
  if(m===dB) return{px:cx,py:h,edge:'bottom'};
  if(m===dL) return{px:0,py:cy,edge:'left'};
             return{px:w,py:cy,edge:'right'};
}
// ノードのポートリストを取得（バスバーは props.portCount から動的生成）
function getNodePorts(node){
  const d=COMP[node.type];
  if(node.type!=='bus_pos'&&node.type!=='bus_neg') return d.ports;
  const count=node.props?.portCount;
  if(!count) return d.ports; // 旧データ互換：portCount 未設定なら従来の10ポート
  const n=Math.max(2,Math.min(20,count));
  const color=node.type==='bus_pos'?'#ef4444':'#374151';
  const topN=Math.ceil(n/2), botN=n-topN;
  const ports=[];
  for(let i=0;i<topN;i++){
    const px=((i+0.5)/topN)*d.w;
    ports.push({id:`p${i}`,label:'',px:Math.round(px),py:0,color});
  }
  for(let i=0;i<botN;i++){
    const px=((i+0.5)/botN)*d.w;
    ports.push({id:`p${topN+i}`,label:'',px:Math.round(px),py:d.h,color});
  }
  return ports;
}
// ノードの実効サイズ（回転考慮後）
function nodeEffSize(node){
  const d=COMP[node.type];
  const w=node.nodeW??d.w, h=node.nodeH??d.h;
  const rot=((node.rotation||0)%360+360)%360;
  return(rot===90||rot===270)?{w:h,h:w}:{w,h};
}
// ノードの回転を考慮したポート位置（実効座標系で返す）
function nodePortPos(node,portId){
  const d=COMP[node.type];
  const w=node.nodeW??d.w, h=node.nodeH??d.h;
  const sx=w/d.w, sy=h/d.h;
  const ov=node.portPositions?.[portId];
  let px,py;
  if(ov){px=ov.px*sx;py=ov.py*sy;}
  else{const p=getNodePorts(node).find(p=>p.id===portId);if(!p)return{px:0,py:0};px=p.px*sx;py=p.py*sy;}
  // 回転変換（元座標 → 実効座標）
  const rot=((node.rotation||0)%360+360)%360;
  if(rot===90)  return{px:Math.round(h-py),py:Math.round(px)};
  if(rot===180) return{px:Math.round(w-px),py:Math.round(h-py)};
  if(rot===270) return{px:Math.round(py),py:Math.round(w-px)};
  return{px:Math.round(px),py:Math.round(py)};
}
// 実効座標 (px, py) を元座標に逆変換（ポートドラッグ保存時に使用）
function unrotatePortPos(node,effPx,effPy){
  const d=COMP[node.type];
  const w=node.nodeW??d.w, h=node.nodeH??d.h;
  const rot=((node.rotation||0)%360+360)%360;
  let px,py;
  if(rot===90){px=effPy;py=h-effPx;}
  else if(rot===180){px=w-effPx;py=h-effPy;}
  else if(rot===270){px=w-effPy;py=effPx;}
  else{px=effPx;py=effPy;}
  return{px,py};
}
function portAbs(nodes,nodeId,portId){
  const n=nodes.find(n=>n.id===nodeId); if(!n) return null;
  const pos=nodePortPos(n,portId); return{x:n.x+pos.px,y:n.y+pos.py};
}
function catmullRom(pts){
  if(!pts||pts.length<2) return '';
  if(pts.length===2){
    const[p,q]=pts; const dx=Math.max(Math.abs(q.x-p.x)*.45,55);
    return`M${p.x},${p.y} C${(p.x+dx).toFixed(1)},${p.y} ${(q.x-dx).toFixed(1)},${q.y} ${q.x},${q.y}`;
  }
  const n=pts.length, ext=[pts[0],...pts,pts[n-1]]; let d=`M${pts[0].x},${pts[0].y}`;
  for(let i=0;i<n-1;i++){
    const[p0,p1,p2,p3]=[ext[i],ext[i+1],ext[i+2],ext[i+3]];
    d+=` C${(p1.x+(p2.x-p0.x)/6).toFixed(1)},${(p1.y+(p2.y-p0.y)/6).toFixed(1)} ${(p2.x-(p3.x-p1.x)/6).toFixed(1)},${(p2.y-(p3.y-p1.y)/6).toFixed(1)} ${p2.x},${p2.y}`;
  }
  return d;
}
// 直線（ポリライン）
function straightPath(pts){
  if(!pts||pts.length<2) return '';
  return 'M'+pts[0].x+','+pts[0].y+pts.slice(1).map(p=>` L${p.x},${p.y}`).join('');
}
// ポート出口方向を判定（right/left/top/bottom）— 回転後の表示座標で判定
function portExitDir(nodes,nodeId,portId){
  const node=nodes.find(n=>n.id===nodeId); if(!node) return 'right';
  const {w:nw,h:nh}=nodeEffSize(node);
  const pos=nodePortPos(node,portId); const tol=4;
  if(pos.px<=tol) return 'left';
  if(pos.px>=nw-tol) return 'right';
  if(pos.py<=tol) return 'top';
  if(pos.py>=nh-tol) return 'bottom';
  return 'right';
}
function stubPt(x,y,dir,d){
  return dir==='right'?{x:x+d,y}:dir==='left'?{x:x-d,y}:dir==='top'?{x,y:y-d}:{x,y:y+d};
}
// 軸平行セグメントがノードのバウンディングボックスと交差するか判定（回転後の実効サイズで判定）
function segBlocked(ax,ay,bx,by,nodes,excludeIds=[],margin=8){
  return nodes.some(n=>{
    if(excludeIds.includes(n.id)) return false;
    const {w:nw,h:nh}=nodeEffSize(n);
    const rl=n.x-margin, rt=n.y-margin, rr=n.x+nw+margin, rb=n.y+nh+margin;
    if(Math.abs(ay-by)<0.5){const x0=Math.min(ax,bx),x1=Math.max(ax,bx);return ay>rt&&ay<rb&&x1>rl&&x0<rr;}
    if(Math.abs(ax-bx)<0.5){const y0=Math.min(ay,by),y1=Math.max(ay,by);return ax>rl&&ax<rr&&y1>rt&&y0<rb;}
    return false;
  });
}
// 配線同士の平行重複チェック（許容距離 tol 以内の平行セグメントが重なればtrue）
function segBlockedByWires(ax,ay,bx,by,segs,tol=7){
  if(!segs||segs.length===0) return false;
  return segs.some(s=>{
    // 両方水平
    if(Math.abs(ay-by)<0.5&&Math.abs(s.ay-s.by)<0.5&&Math.abs(ay-s.ay)<tol){
      const x0=Math.min(ax,bx),x1=Math.max(ax,bx),sx0=Math.min(s.ax,s.bx),sx1=Math.max(s.ax,s.bx);
      return x1>sx0+4&&x0<sx1-4;
    }
    // 両方垂直
    if(Math.abs(ax-bx)<0.5&&Math.abs(s.ax-s.bx)<0.5&&Math.abs(ax-s.ax)<tol){
      const y0=Math.min(ay,by),y1=Math.max(ay,by),sy0=Math.min(s.ay,s.by),sy1=Math.max(s.ay,s.by);
      return y1>sy0+4&&y0<sy1-4;
    }
    return false;
  });
}

// 直角（オルソゴナル）: ポートスタブ + コンポーネント回避 + 配線重複回避
// 戻り値: {path: SVG文字列, segs: [{ax,ay,bx,by},...]}
// prevSegs: 先行配線のセグメント（重複回避に使用）
function orthoPath(pts,nodes=[],fromId='',toId='',fromPortId='',toPortId='',prevSegs=[]){
  if(!pts||pts.length<2) return{path:'',segs:[]};
  if(pts.length===2){
    const[p,q]=pts;
    const STUB=28, PAD=40;
    const fromDir=portExitDir(nodes,fromId,fromPortId);
    const toDir=portExitDir(nodes,toId,toPortId);
    const ps=stubPt(p.x,p.y,fromDir,STUB);
    const qs=stubPt(q.x,q.y,toDir,STUB);
    // 関連するノードのみで bounds を計算（遠くにある未接続機器の移動で経路が変わるのを防止）
    const margin=80;
    const minX=Math.min(p.x,q.x)-margin, maxX=Math.max(p.x,q.x)+margin;
    const minY=Math.min(p.y,q.y)-margin, maxY=Math.max(p.y,q.y)+margin;
    const relevantNodes=nodes.filter(n=>{
      // 配線端のノードは必ず含める（外周ルートが端ノードを貫通しないように）
      if(n.id===fromId||n.id===toId) return true;
      const {w:nw,h:nh}=nodeEffSize(n);
      return n.x+nw>minX && n.x<maxX && n.y+nh>minY && n.y<maxY;
    });
    const bounds=relevantNodes.map(n=>{const {w:nw,h:nh}=nodeEffSize(n);return{t:n.y,b:n.y+nh,l:n.x,r:n.x+nw};});
    const ay_=(bounds.length?Math.min(...bounds.map(b=>b.t)):Math.min(ps.y,qs.y))-PAD;
    const by_=(bounds.length?Math.max(...bounds.map(b=>b.b)):Math.max(ps.y,qs.y))+PAD;
    const lx_=(bounds.length?Math.min(...bounds.map(b=>b.l)):Math.min(ps.x,qs.x))-PAD;
    const rx_=(bounds.length?Math.max(...bounds.map(b=>b.r)):Math.max(ps.x,qs.x))+PAD;
    const mx=(ps.x+qs.x)/2, my=(ps.y+qs.y)/2;
    // ─── ルーティング: 決定論的 2 段階フォールバック ───
    // Stage 1: L字（1コーナー）2候補 — 最もシンプルで美しい経路
    // Stage 2: 基本6候補 — mid/外周経由
    // Stage 3: 失敗時は L字HV 直線で描画し warning フラグを立てる（⚠️ 赤点線表示で人手調整を促す）
    // ※ 配線重複回避(offCands/stubExtCands) は廃止 — 重複しても電気的には問題なく、
    //   迂回ロジックが原因の不具合の方が大きいため。重複が気になる場合は中継点ドラッグで手動調整。
    const lCands=[
      [ps,{x:qs.x,y:ps.y},qs], // HV
      [ps,{x:ps.x,y:qs.y},qs], // VH
    ];
    const base=[
      [ps,{x:mx,y:ps.y},{x:mx,y:qs.y},qs],
      [ps,{x:ps.x,y:my},{x:qs.x,y:my},qs],
      [ps,{x:ps.x,y:ay_},{x:qs.x,y:ay_},qs],
      [ps,{x:ps.x,y:by_},{x:qs.x,y:by_},qs],
      [ps,{x:lx_,y:ps.y},{x:lx_,y:qs.y},qs],
      [ps,{x:rx_,y:ps.y},{x:rx_,y:qs.y},qs],
    ];
    const cands=[...lCands,...base];
    for(const mid of cands){
      const all=[p,...mid,q];
      let ok=true;
      for(let i=0;i<all.length-1;i++){
        const a=all[i],b=all[i+1];
        const ex=i===0?[fromId]:i===all.length-2?[toId]:[];
        if(segBlocked(a.x,a.y,b.x,b.y,nodes,ex)){ok=false;break;}
      }
      if(ok){
        const segs=all.slice(0,-1).map((a,i)=>({ax:a.x,ay:a.y,bx:all[i+1].x,by:all[i+1].y}));
        return{path:'M'+all.map(pt=>`${pt.x},${pt.y}`).join(' L'),segs};
      }
    }
    // フォールバック: L字HV を warning 付きで返す（部品を貫く可能性あり → ⚠️表示）
    const fb=[p,ps,{x:qs.x,y:ps.y},qs,q];
    const segs=fb.slice(0,-1).map((a,i)=>({ax:a.x,ay:a.y,bx:fb[i+1].x,by:fb[i+1].y}));
    return{path:'M'+fb.map(pt=>`${pt.x},${pt.y}`).join(' L'),segs,warning:true};
  }
  // 中継点あり: H-V エルボー（コンポーネント回避あり）
  let d=`M${pts[0].x},${pts[0].y}`; const segs=[];
  for(let i=0;i<pts.length-1;i++){
    const p=pts[i],q=pts[i+1];
    const exF=i===0?[fromId]:[];
    const exT=i===pts.length-2?[toId]:[];
    // H-V check
    const hv1=segBlocked(p.x,p.y,q.x,p.y,nodes,exF);
    const hv2=segBlocked(q.x,p.y,q.x,q.y,nodes,exT);
    // V-H check
    const vh1=segBlocked(p.x,p.y,p.x,q.y,nodes,exF);
    const vh2=segBlocked(p.x,q.y,q.x,q.y,nodes,exT);
    // V-H を優先（H-Vが塞がれていてV-Hが通れる場合）
    if((hv1||hv2)&&!vh1&&!vh2){
      d+=` L${p.x},${q.y} L${q.x},${q.y}`;
      segs.push({ax:p.x,ay:p.y,bx:p.x,by:q.y},{ax:p.x,ay:q.y,bx:q.x,by:q.y});
    } else {
      d+=` L${q.x},${p.y} L${q.x},${q.y}`;
      segs.push({ax:p.x,ay:p.y,bx:q.x,by:p.y},{ax:q.x,ay:p.y,bx:q.x,by:q.y});
    }
  }
  return{path:d,segs};
}
// 直前点に対して 90° 補正したカーソル位置を返す（X差 vs Y差の大きい方の軸を採用）
function snap90(prev,cursor){
  const dx=Math.abs(cursor.x-prev.x), dy=Math.abs(cursor.y-prev.y);
  return dx>=dy?{x:cursor.x,y:prev.y}:{x:prev.x,y:cursor.y};
}
// クリック式：水平/垂直のみで結ぶ。クリック時に snap90 補正済みなので隣接ウェイポイント間は H か V。
// 最終ポート接続のみ、最後のウェイポイントとポート位置がずれている場合に L字コーナーを自動挿入。
function clickPath(pts){
  if(!pts||pts.length<2) return{path:'',segs:[]};
  // 最後の点（終了ポート）が直前点と整列していなければコーナーを挿入
  const fixed=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const a=fixed[fixed.length-1], b=pts[i];
    const sameX=Math.abs(a.x-b.x)<0.5, sameY=Math.abs(a.y-b.y)<0.5;
    if(sameX||sameY){
      fixed.push(b);
    } else {
      // 整列していない：L字コーナーを挿入（前セグメント方向の続きで自然な向きに）
      // 直前セグメント方向：fixed[len-2] → a
      let prevDir=null;
      if(fixed.length>=2){
        const p=fixed[fixed.length-2];
        if(Math.abs(p.x-a.x)<0.5) prevDir='V';
        else if(Math.abs(p.y-a.y)<0.5) prevDir='H';
      }
      const useVH = prevDir==='H'?true : prevDir==='V'?false : Math.abs(a.y-b.y)>Math.abs(a.x-b.x);
      fixed.push(useVH?{x:a.x,y:b.y}:{x:b.x,y:a.y});
      fixed.push(b);
    }
  }
  let d=`M${fixed[0].x},${fixed[0].y}`;
  const segs=[];
  for(let i=1;i<fixed.length;i++){
    const a=fixed[i-1],b=fixed[i];
    d+=` L${b.x},${b.y}`;
    segs.push({ax:a.x,ay:a.y,bx:b.x,by:b.y});
  }
  return{path:d,segs};
}
// 戻り値: {path, segs}
function buildPath(pts,style,nodes=[],fromId='',toId='',fromPortId='',toPortId='',prevSegs=[]){
  if(style==='straight') return{path:straightPath(pts),segs:[]};
  if(style==='ortho') return orthoPath(pts,nodes,fromId,toId,fromPortId,toPortId,prevSegs);
  if(style==='click') return clickPath(pts);
  return{path:catmullRom(pts),segs:[]};
}
function connPts(conn,nodes){
  const p1=portAbs(nodes,conn.fromNode,conn.fromPort);
  const p2=portAbs(nodes,conn.toNode,conn.toPort);
  if(!p1||!p2) return null;
  return[p1,...(conn.waypoints||[]),p2];
}
function centroid(pts){ return pts.reduce((s,p)=>({x:s.x+p.x/pts.length,y:s.y+p.y/pts.length}),{x:0,y:0}); }
function specLine(node){
  const p=node.props;
  switch(node.type){
    case'battery':    return`${p.voltage||12}V ${p.ah||'?'}Ah (${p.type||''})`;
    case'inverter':   return`${p.watts||'?'}W ${p.type||'正弦波'}`;
    case'solar_panel':return`${p.watts||'?'}W / Voc ${p.voc||'?'}V`;
    case'mppt':       return`最大 ${p.maxA||'?'}A`;
    case'pwm':        return`最大 ${p.maxA||'?'}A`;
    case'dc_dc':      return`${p.inputV||'?'}V→${p.outputV||'?'}V ${p.maxA||'?'}A`;
    case'charger':    return`${p.outputV||12}V ${p.maxA||'?'}A`;
    case'fuse':       return`${p.amps||'?'}A ${p.type||'ANL'}`;
    case'breaker':    return`${p.amps||'?'}A`;
    case'switch':     return`${p.amps||'?'}A`;
    case'dc_load':    return`${p.watts||'?'}W DC${p.voltage||12}V`;
    case'ac_load':    return`${p.watts||'?'}W AC`;
    case'shore_power':return`AC${p.voltage||100}V`;
    default:return'';
  }
}
function portLabelOffset(px,py,w,h){
  const tol=4;
  if(py<=tol)   return{left:px-4,top:py+5,  transform:'translateX(-50%)'};
  if(py>=h-tol) return{left:px-4,top:py-14, transform:'translateX(-50%)'};
  if(px<=tol)   return{left:px+6,top:py-6};
  return               {left:px-28,top:py-6};
}

// ═══════════════════════════════════════════════════════════════
//  Electrical Check Engine
// ═══════════════════════════════════════════════════════════════
function runChecks(nodes,conns){
  const items=[];
  if(nodes.length===0) return[{level:'info',cat:'情報',title:'部品がありません',details:[]}];

  // ── 1. Connectivity ──
  const adj={};
  nodes.forEach(n=>{adj[n.id]=new Set();});
  conns.forEach(c=>{if(adj[c.fromNode])adj[c.fromNode].add(c.toNode);if(adj[c.toNode])adj[c.toNode].add(c.fromNode);});

  const isolated=nodes.filter(n=>adj[n.id].size===0);
  if(isolated.length>0){
    items.push({level:'error',cat:'接続',title:`未接続の部品 (${isolated.length}件)`,
      details:isolated.map(n=>`${COMP[n.type].label}: ${n.props.name}`)});
  }
  // BFS for connected components
  const connectedNodes=nodes.filter(n=>adj[n.id].size>0);
  if(connectedNodes.length>0){
    const visited=new Set();
    const q=[connectedNodes[0].id];
    while(q.length>0){const c=q.shift();if(visited.has(c))continue;visited.add(c);adj[c].forEach(nb=>{if(!visited.has(nb))q.push(nb);});}
    const discon=connectedNodes.filter(n=>!visited.has(n.id));
    if(discon.length>0){
      items.push({level:'warn',cat:'接続',title:`回路が分離しています (${discon.length}箇所)`,
        details:discon.map(n=>`${COMP[n.type].label}: ${n.props.name}`)});
    } else if(isolated.length===0){
      items.push({level:'ok',cat:'接続',title:'全部品が一つの回路で接続されています',details:[]});
    }
  }

  // ── ショート回路チェック（極性違反） ──
  // 赤(+)ポート と 黒(−)ポート を直接結ぶ配線はショート回路
  const shorts=[];
  const mixed=[]; // AC ⇔ DC の混在
  conns.forEach(c=>{
    const fn=nodes.find(n=>n.id===c.fromNode), tn=nodes.find(n=>n.id===c.toNode);
    if(!fn||!tn) return;
    const fpc=getNodePorts(fn).find(p=>p.id===c.fromPort)?.color;
    const tpc=getNodePorts(tn).find(p=>p.id===c.toPort)?.color;
    if(!fpc||!tpc) return;
    const isRedDark=(fpc==='#ef4444'&&tpc==='#374151')||(fpc==='#374151'&&tpc==='#ef4444');
    const isACvsDC=(fpc==='#6366f1'&&(tpc==='#ef4444'||tpc==='#374151'))||
                   (tpc==='#6366f1'&&(fpc==='#ef4444'||fpc==='#374151'));
    const nm=`${fn.props.name||'?'}(${c.fromPort}) ⚡ ${tn.props.name||'?'}(${c.toPort})`;
    if(isRedDark) shorts.push(nm);
    else if(isACvsDC) mixed.push(nm);
  });
  if(shorts.length>0){
    items.push({level:'error',cat:'安全',title:`⚡ ショート回路の危険 (${shorts.length}本)`,
      details:['+極(赤)と−極(黒)が直接接続されています。配線を見直してください。',...shorts]});
  }
  if(mixed.length>0){
    items.push({level:'error',cat:'安全',title:`AC/DC 混在配線 (${mixed.length}本)`,
      details:['AC ポートと DC ポートを直接接続しています。機器を破損する恐れがあります。',...mixed]});
  }

  // ── 2. Wire capacity (派生値ベース) ──
  let anyWireOk=false;
  conns.forEach(c=>{
    const fn=nodes.find(n=>n.id===c.fromNode), tn=nodes.find(n=>n.id===c.toNode);
    const nm=`${fn?.props.name||'?'} → ${tn?.props.name||'?'}`;
    const d=getDerivedWire(c,nodes,conns,12,null); // 簡易: 経路 segs なしで判定（lenM はフォールバック1）
    if(d.amps>0&&d.wireSize){
      const w=WIRE_SIZES.find(w=>w.label===d.wireSize);
      if(w&&d.amps>w.maxA){
        items.push({level:'error',cat:'配線',title:'電線容量オーバー',
          details:[`${nm}: ${d.amps}A > ${d.wireSize}の最大${w.maxA}A`]});
      } else { anyWireOk=true; }
    }
  });
  if(anyWireOk) items.push({level:'ok',cat:'配線',title:'電線容量チェックOK',details:[]});

  // ── 3. Voltage compatibility ──
  let voltErrors=0;
  conns.forEach(c=>{
    const fn=nodes.find(n=>n.id===c.fromNode), tn=nodes.find(n=>n.id===c.toNode);
    if(!fn||!tn) return;
    const pairs=[
      {a:fn,b:tn,at:'battery',bt:'inverter',aV:n=>n.props.voltage,bV:n=>n.props.inputV,label:'バッテリー↔インバーター'},
      {a:fn,b:tn,at:'inverter',bt:'battery',aV:n=>n.props.inputV,bV:n=>n.props.voltage,label:'バッテリー↔インバーター'},
      {a:fn,b:tn,at:'battery',bt:'dc_dc',aV:n=>n.props.voltage,bV:n=>n.props.inputV,label:'バッテリー↔DC-DC'},
      {a:fn,b:tn,at:'dc_dc',bt:'battery',aV:n=>n.props.inputV,bV:n=>n.props.voltage,label:'バッテリー↔DC-DC'},
    ];
    pairs.forEach(({a,b,at,bt,aV,bV,label})=>{
      if(a.type===at&&b.type===bt){
        const va=aV(a), vb=bV(b);
        if(va&&vb&&va!==vb){
          voltErrors++;
          items.push({level:'error',cat:'電圧',title:`電圧不一致 (${label})`,
            details:[`${a.props.name}(${va}V) ↔ ${b.props.name}(${vb}V)`]});
        }
      }
    });
  });
  if(voltErrors===0&&nodes.some(n=>n.type==='battery'))
    items.push({level:'ok',cat:'電圧',title:'電圧整合性チェックOK',details:[]});

  // ── 4. MPPT/PWM solar current ──
  nodes.filter(n=>n.type==='mppt'||n.type==='pwm').forEach(ctrl=>{
    const solar=conns.filter(c=>c.fromNode===ctrl.id||c.toNode===ctrl.id)
      .map(c=>{const o=c.fromNode===ctrl.id?nodes.find(n=>n.id===c.toNode):nodes.find(n=>n.id===c.fromNode);return o?.type==='solar_panel'?o:null;}).filter(Boolean);
    if(solar.length>0){
      const isc=solar.reduce((s,p)=>s+(+p.props.isc||0),0);
      const max=+ctrl.props.maxA||0;
      if(max>0&&isc>max)
        items.push({level:'warn',cat:'容量',title:`ソーラー電流超過 (${ctrl.props.name})`,details:[`Isc合計 ${isc.toFixed(1)}A > コントローラー最大 ${max}A`]});
      else if(max>0)
        items.push({level:'ok',cat:'容量',title:`${ctrl.props.name}: ソーラー電流OK`,details:[`${isc.toFixed(1)}A / ${max}A`]});
    }
  });

  // ── 5. Inverter load ──
  nodes.filter(n=>n.type==='inverter').forEach(inv=>{
    const loads=conns.filter(c=>c.fromNode===inv.id||c.toNode===inv.id)
      .map(c=>{const o=c.fromNode===inv.id?nodes.find(n=>n.id===c.toNode):nodes.find(n=>n.id===c.fromNode);return o?.type==='ac_load'?o:null;}).filter(Boolean);
    if(loads.length>0){
      const total=loads.reduce((s,l)=>s+(+l.props.watts||0),0);
      const invW=+inv.props.watts||0;
      if(invW>0){
        const pct=Math.round(total/invW*100);
        if(total>invW)
          items.push({level:'error',cat:'容量',title:`インバーター容量オーバー (${inv.props.name})`,details:[`AC機器合計 ${total}W > 定格 ${invW}W`]});
        else if(total>invW*0.8)
          items.push({level:'warn',cat:'容量',title:`インバーター高負荷 ${pct}% (${inv.props.name})`,details:[`AC機器合計 ${total}W / 定格 ${invW}W`]});
        else
          items.push({level:'ok',cat:'容量',title:`${inv.props.name}: 負荷OK (${pct}%)`,details:[`${total}W / ${invW}W`]});
      }
    }
  });

  // ── 保護デバイス（ヒューズ・ブレーカー・スイッチ）の提案 ──
  // 指定ノード・ポートから出発し、バスバーは通過、特定の保護デバイスに到達するか BFS で判定
  function hasProtectionFromPort(startId,startPort,maxDepth=3){
    const visited=new Set([startId]);
    let frontier=conns.filter(c=>(c.fromNode===startId&&c.fromPort===startPort)||(c.toNode===startId&&c.toPort===startPort))
      .map(c=>c.fromNode===startId?c.toNode:c.fromNode);
    for(let d=0;d<maxDepth;d++){
      const next=[];
      for(const id of frontier){
        if(visited.has(id)) continue;
        visited.add(id);
        const n=nodes.find(x=>x.id===id); if(!n) continue;
        if(n.type==='fuse'||n.type==='breaker'||n.type==='switch') return n;
        // バスバー / バスバー類・バッテリーは通過（同一 DC バス上の保護装置を検出するため）
        if(n.type==='bus_pos'||n.type==='bus_neg'||n.type==='bus_bar'||n.type==='battery'){
          conns.filter(c=>c.fromNode===id||c.toNode===id).forEach(c=>{
            next.push(c.fromNode===id?c.toNode:c.fromNode);
          });
        }
      }
      frontier=next;
      if(!frontier.length) break;
    }
    return null;
  }
  // ① バッテリー+端子に保護装置（ヒューズ/ブレーカー/スイッチ）が無い場合
  nodes.filter(n=>n.type==='battery').forEach(bat=>{
    // 接続がない場合はスキップ
    const hasAnyWire=conns.some(c=>c.fromNode===bat.id||c.toNode===bat.id);
    if(!hasAnyWire) return;
    const prot=hasProtectionFromPort(bat.id,'pos',3);
    if(!prot){
      items.push({level:'warn',cat:'安全',title:`バッテリー+端子に保護装置がありません (${bat.props.name})`,
        details:[
          'バッテリーの+極端子は配線が短絡した際の発火事故を防ぐため、最も近い位置にヒューズ（または ANL ヒューズ＋ブレーカー）を設置してください。',
          '推奨: ⊡ ヒューズ または ⊕ サーキットブレーカー をバッテリーと負荷の間に配置'
        ]});
    }
  });
  // ② インバーター DC+ に保護装置が無い場合（高電流装置）
  nodes.filter(n=>n.type==='inverter').forEach(inv=>{
    const hasAnyWire=conns.some(c=>(c.fromNode===inv.id&&c.fromPort==='dc_pos')||(c.toNode===inv.id&&c.toPort==='dc_pos'));
    if(!hasAnyWire) return;
    const prot=hasProtectionFromPort(inv.id,'dc_pos',3);
    if(!prot){
      const w=+inv.props.watts||0;
      const v=+inv.props.inputV||12;
      const fuseA=v>0?Math.ceil((w/v/0.85)*1.25/10)*10:100;
      items.push({level:'warn',cat:'安全',title:`インバーター DC+ に専用ヒューズがありません (${inv.props.name})`,
        details:[`高電流が流れる経路には、機器近傍にヒューズが推奨されます。`,`推奨容量: 約 ${fuseA}A の ⊡ ANL ヒューズ`]});
    }
  });
  // ③ MPPT のソーラー側に保護装置が無い場合（任意推奨）
  nodes.filter(n=>n.type==='mppt'||n.type==='pwm').forEach(ctrl=>{
    const hasSolarWire=conns.some(c=>(c.fromNode===ctrl.id&&c.fromPort==='solar_pos')||(c.toNode===ctrl.id&&c.toPort==='solar_pos'));
    if(!hasSolarWire) return;
    const prot=hasProtectionFromPort(ctrl.id,'solar_pos',3);
    if(!prot){
      const maxA=+ctrl.props.maxA||0;
      const fuseA=Math.ceil(maxA*1.25/5)*5;
      items.push({level:'info',cat:'安全',title:`ソーラー入力にヒューズ推奨 (${ctrl.props.name})`,
        details:[`屋外の長い配線は短絡リスクがあるため、ソーラーパネル付近に保護装置の設置を推奨します。`,`推奨容量: 約 ${fuseA||30}A の ⊡ ヒューズ`]});
    }
  });
  // ④ 主スイッチ（バッテリー切断）の有無を確認
  const hasSwitch=nodes.some(n=>n.type==='switch');
  const hasBattery=nodes.some(n=>n.type==='battery');
  if(hasBattery&&!hasSwitch){
    items.push({level:'info',cat:'安全',title:`バッテリースイッチが未配置`,
      details:['整備・緊急時に電源を切れるよう、メインスイッチ ◎ をバッテリー近傍に配置することを推奨します。']});
  }
  // ⑤ ヒューズ/スイッチ/ブレーカーの入出方向チェック
  // 規約：「入」ポートは源（バッテリー・MPPT B+・充電器 DC+）側、「出」は負荷側に接続する
  const SOURCE_TYPES=new Set(['battery']);
  const SOURCE_PORTS=[
    {type:'mppt',port:'bat_pos'},{type:'mppt',port:'bat_neg'},
    {type:'pwm',port:'bat_pos'},{type:'pwm',port:'bat_neg'},
    {type:'charger',port:'dc_pos'},{type:'charger',port:'dc_neg'},
    {type:'dc_dc',port:'out_pos'},{type:'dc_dc',port:'out_neg'},
  ];
  const isSourceSide=(n,portId)=>{
    if(!n) return false;
    if(SOURCE_TYPES.has(n.type)) return true;
    return SOURCE_PORTS.some(s=>s.type===n.type&&s.port===portId);
  };
  nodes.filter(n=>n.type==='fuse'||n.type==='breaker'||n.type==='switch').forEach(prot=>{
    const inConns=conns.filter(c=>(c.fromNode===prot.id&&c.fromPort==='in')||(c.toNode===prot.id&&c.toPort==='in'));
    const outConns=conns.filter(c=>(c.fromNode===prot.id&&c.fromPort==='out')||(c.toNode===prot.id&&c.toPort==='out'));
    if(inConns.length===0||outConns.length===0) return; // 片側未接続はスキップ
    // 直接接続されている相手を取得
    const getOther=(c,id)=>c.fromNode===id?{nodeId:c.toNode,portId:c.toPort}:{nodeId:c.fromNode,portId:c.fromPort};
    let inIsLoad=false, outIsSource=false;
    const inOther=getOther(inConns[0],prot.id);
    const inNode=nodes.find(n=>n.id===inOther.nodeId);
    const outOther=getOther(outConns[0],prot.id);
    const outNode=nodes.find(n=>n.id===outOther.nodeId);
    // 「出」側が直接 source（電源側）に繋がっていたら反転
    if(isSourceSide(outNode,outOther.portId)){
      // かつ「入」側が負荷系（バスバー/負荷/インバーター等）なら確定的に反転
      const inIsBusOrLoad=inNode&&['bus_pos','bus_neg','dc_load','ac_load','inverter','bus_bar'].includes(inNode.type);
      if(inIsBusOrLoad||!isSourceSide(inNode,inOther.portId)){
        items.push({level:'warn',cat:'安全',title:`${COMP[prot.type].label}の入出方向が逆 (${prot.props.name})`,
          details:[
            `${prot.props.name}の「出」端子が源側 (${outNode?.props.name||outNode?.type}) に接続されています。`,
            `規約：「入」端子を源（バッテリー・MPPT B+・充電器 DC+ 等）側、「出」端子を負荷側に接続してください。`,
            `※ 電気的には双方向に動作しますが、配線図の可読性と整備性のため向きを揃えることを推奨します。`
          ]});
      }
    }
  });

  // 全保護OK の総括
  const safetyHasIssue=items.some(it=>it.cat==='安全');
  if(!safetyHasIssue&&hasBattery){
    items.push({level:'ok',cat:'安全',title:`保護装置 配置 OK`,details:['ヒューズ・ブレーカー・スイッチの配置・向きに問題はありません。']});
  }

  // ── 6. Wire size vs amps summary (派生値ベース) ──
  const noAmps=conns.filter(c=>{
    const d=getDerivedWire(c,nodes,conns,12,null);
    return !(d.amps>0);
  });
  if(noAmps.length>0){
    items.push({level:'info',cat:'配線',title:`電流が確定できない配線 ${noAmps.length}本`,details:['両端機器の仕様が未入力か、バスバー経由の集計が困難な配線です']});
  }

  return items;
}

function Palette({open,onClose,onTapPlace}){
  const bycat=useMemo(()=>{
    const m={}; CATS.forEach(c=>{m[c]=[];});
    Object.entries(COMP).forEach(([k,v])=>{if(m[v.cat])m[v.cat].push({key:k,...v});});
    return m;
  },[]);
  return(
    <div className={`pal${open?' open':''}`}>
      {CATS.map(cat=>bycat[cat].length===0?null:(
        <div className="pal-sec" key={cat}>
          <div className="pal-cat">{cat}</div>
          {bycat[cat].map(d=>{
            const desc=COMP_DESC[d.key];
            const title=desc?`${d.label}\n\n【役割】${desc.role}\n\n【配線】${desc.wiring}`:d.label;
            return(
              <div key={d.key} className="pal-item" style={{borderColor:d.color+'40',background:d.bg}}

          })}

}

// ═══════════════════════════════════════════════════════════════
//  Wire Gauge Calc
// ═══════════════════════════════════════════════════════════════
function WireGaugeCalc({systemV}){
  const [amps,setA]=useState(''); const [len,setL]=useState(''); const [volt,setV]=useState(String(systemV));
  useEffect(()=>setV(String(systemV)),[systemV]);
  const res=useMemo(()=>calcWire(+amps,+len,+volt),[amps,len,volt]);
  const fuse=amps?suggestFuse(+amps):null;
  return(
    <div className="psec">
      <div className="ptitle">⚡ 電線サイズ計算</div>
      <div className="wg-grid">
        <div className="wg-field"><label>電流 (A)</label><input type="number" min="0" value={amps} onChange={e=>setA(e.target.value)} placeholder="例: 40"/></div>
        <div className="wg-field"><label>ケーブル長 (m)</label><input type="number" min="0" value={len} onChange={e=>setL(e.target.value)} placeholder="例: 3"/></div>
        <div className="wg-field"><label>電圧 (V)</label><input type="number" min="0" value={volt} onChange={e=>setV(e.target.value)} placeholder="12/24/48"/></div>
        <div className="wg-field" style={{display:'flex',alignItems:'flex-end',paddingBottom:4}}><span style={{fontSize:10,color:'#94a3b8'}}>電圧降下3%・KIV空中単線基準</span></div>
      </div>
      {res&&<div className="gc"><div className="gc-big">{res.label}</div><div className="gc-row"><span>AWG {res.awg}</span><span>最大 {res.maxA}A</span></div></div>}
      {fuse&&<div className="fc"><div style={{fontSize:10,color:'#c2410c',fontWeight:700,marginBottom:2}}>推奨ヒューズ</div><div className="fc-big">{fuse}A</div></div>}
    </div>
  );
}

              onClick={()=>onResizeNode(node.id,null,null)}>↩ デフォルトサイズに戻す</button>}
          </>);})()}
          <button className="btn btn-danger btn-sm" style={{marginTop:8}} onClick={onDelSelected}>削除</button>
        </div>
      </div>
    );
  }

  if(selected?.type==='conn'){
    const conn=connections.find(c=>c.id===selected.id); if(!conn) return<div className={cls}/>;
    const fn=nodes.find(n=>n.id===conn.fromNode), tn=nodes.find(n=>n.id===conn.toNode);
    // 派生値を実経路から算出（PropPanel 内で再度 buildPath を呼んで segs を得る）
    const _pts=connPts(conn,nodes);
    const _r=_pts?buildPath(_pts,conn.style||wireStyle||'click',nodes,conn.fromNode,conn.toNode,conn.fromPort,conn.toPort,[]):{segs:[]};
    let derived=getDerivedWire(conn,nodes,connections,systemV,_r.segs);
    const routeWarning=_r.warning===true;
    // ショート回路・極性違反の検出（リアルタイム警告）
    const _fpc=fn?getNodePorts(fn).find(p=>p.id===conn.fromPort)?.color:null;
    const _tpc=tn?getNodePorts(tn).find(p=>p.id===conn.toPort)?.color:null;
    const isShort=(_fpc==='#ef4444'&&_tpc==='#374151')||(_fpc==='#374151'&&_tpc==='#ef4444');
    const isMixed=(_fpc==='#6366f1'&&(_tpc==='#ef4444'||_tpc==='#374151'))||(_tpc==='#6366f1'&&(_fpc==='#ef4444'||_fpc==='#374151'));
    // ±ペア同期（partner と両方 auto なら大きい方に揃える）
    const _partner=findPairPartner(conn,connections,nodes);
    let pairedWith=null;
    if(_partner){
      const pPts=connPts(_partner,nodes);
      const pR=pPts?buildPath(pPts,_partner.style||wireStyle||'click',nodes,_partner.fromNode,_partner.toNode,_partner.fromPort,_partner.toPort,[]):{segs:[]};
      const pDerived=getDerivedWire(_partner,nodes,connections,systemV,pR.segs);
      if(derived.sizeIsAuto&&pDerived.sizeIsAuto){
        const myMm2=WIRE_SIZES.find(s=>s.label===derived.wireSize)?.mm2||0;
        const prMm2=WIRE_SIZES.find(s=>s.label===pDerived.wireSize)?.mm2||0;
        if(prMm2>myMm2){
          derived={...derived,wireSize:pDerived.wireSize,sizeRes:pDerived.sizeRes,paired:true};
        } else {
          derived={...derived,paired:true};
        }
      }
      pairedWith=_partner;
    }
    const res=derived.sizeRes;
    const fuse=derived.amps?suggestFuse(derived.amps):null;
    const curColor=conn.wireColor||'#94a3b8';
    const autoThick=wireThick(derived.wireSize);
    const curThick=conn.customThick!=null?conn.customThick:autoThick;
    const wpCount=(conn.waypoints||[]).length;
    const upd=patch=>onUpdateConn(conn.id,patch);

    return(
      <div className={cls}>
        <div className="psec">
          <div className="ptitle">🔗 配線プロパティ</div>
          <div style={{fontSize:11,color:'#94a3b8',marginBottom:10}}>{fn?.props.name} → {tn?.props.name}</div>
          {isShort&&<div style={{background:'#fef2f2',border:'2px solid #dc2626',color:'#991b1b',padding:'8px 10px',borderRadius:8,fontSize:12,marginBottom:10,lineHeight:1.5,fontWeight:600}}>
            ⚡ <b>ショート回路の危険！</b><br/>
            <span style={{fontWeight:400,fontSize:11}}>+極(赤)と−極(黒)が直接接続されています。バッテリーを瞬時に破損する恐れがあります。配線を見直してください。</span>
          </div>}
          {isMixed&&<div style={{background:'#fef2f2',border:'2px solid #dc2626',color:'#991b1b',padding:'8px 10px',borderRadius:8,fontSize:12,marginBottom:10,lineHeight:1.5,fontWeight:600}}>
            ⚡ <b>AC/DC 混在配線！</b><br/>
            <span style={{fontWeight:400,fontSize:11}}>AC ポートと DC ポートを直接接続しています。機器を破損する恐れがあります。</span>
          </div>}
          {routeWarning&&<div style={{background:'#fef2f2',border:'1px solid #fecaca',color:'#991b1b',padding:'6px 8px',borderRadius:6,fontSize:11,marginBottom:10,lineHeight:1.5}}>
            ⚠️ <b>自動経路が見つかりませんでした</b><br/>
            部品を貫通する可能性があります。配線上を <b>⊕クリックで中継点を追加</b> し、ドラッグして経路を調整してください。
          </div>}
          {derived.paired&&<div style={{background:'#ecfeff',border:'1px solid #a5f3fc',color:'#0e7490',padding:'6px 8px',borderRadius:6,fontSize:11,marginBottom:10,lineHeight:1.5}}>
            🔗 <b>±ペアで同期中</b><br/>
            同じ機器間の反対極性配線とサイズが揃えられています（大きい方に合わせる）。どちらかを上書きすると同期は解除されます。
          </div>}

          {/* ── Wire Color ── */}
          <div className="prow">
            <div className="plbl">配線の色</div>
            <div className="color-row">
              {WIRE_COLORS.map(wc=>(
                <div key={wc.color} className={`cswatch${curColor===wc.color?' active':''}`}
                  style={{background:wc.color,boxShadow:wc.color==='#f8fafc'?'inset 0 0 0 1px #cbd5e1':''}}
                  title={wc.name}
                  onClick={()=>upd({wireColor:wc.color})}/>
              ))}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <label style={{fontSize:10,color:'#94a3b8'}}>カスタム:</label>
              <input type="color" value={curColor} onChange={e=>upd({wireColor:e.target.value})}
                style={{width:36,height:24,border:'1px solid #e2e8f0',borderRadius:4,cursor:'pointer',padding:1}}/>
              <span style={{fontSize:11,color:'#64748b',fontFamily:'monospace'}}>{curColor}</span>
            </div>
          </div>

          {/* ── Wire Thickness ── */}
          <div className="prow">
            <div className="plbl" style={{display:'flex',justifyContent:'space-between'}}>
              <span>画面表示の太さ</span>
              <span style={{color:'#94a3b8',fontSize:10}}>{curThick.toFixed(1)}px{conn.customThick==null?' (自動)':' (カスタム)'}</span>
            </div>
            <div className="thick-row">
              <input type="range" className="thick-slider" min={1} max={20} step={0.5}
                value={curThick}
                onChange={e=>upd({customThick:+e.target.value})}/>
              <span className="thick-val">{curThick.toFixed(1)}</span>
            </div>
            {conn.customThick!=null&&(
              <button className="btn btn-ghost btn-sm" style={{marginTop:4}} onClick={()=>upd({customThick:null})}>
                ↩ 電線サイズから自動計算
              </button>
            )}
          </div>

          <hr style={{border:'none',borderTop:'1px solid #f1f5f9',margin:'8px 0'}}/>

          {/* ── Electrical (派生値表示・上書き可能) ── */}
          <div className="prow">
            <div className="plbl" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span>最大電流 (A)</span>
              <span style={{fontSize:10,color:derived.ampsIsAuto?'#0891b2':'#c2410c',fontWeight:600}}>
                {derived.ampsIsAuto?`自動: ${derived.ampsAuto}A`:`上書き中（自動値: ${derived.ampsAuto}A）`}
              </span>
            </div>
            <div style={{display:'flex',gap:4}}>
              <input className="pinput" type="number" value={conn.amps||''} onChange={e=>upd({amps:e.target.value})}
                placeholder={`自動: ${derived.ampsAuto||'—'}`} style={{flex:1}}/>
              {!derived.ampsIsAuto&&<button className="btn btn-ghost btn-sm" style={{padding:'2px 8px',fontSize:10}}
                title="上書きを解除して自動計算に戻します" onClick={()=>upd({amps:''})}>↩ 自動</button>}
            </div>
          </div>
          <div className="prow">
            <div className="plbl" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span>ケーブル長 (m, 片道)</span>
              <span style={{fontSize:10,color:derived.lenIsAuto?'#0891b2':'#c2410c',fontWeight:600}}>
                {derived.lenIsAuto?`自動: ${derived.lenAuto}m（実経路）`:`上書き中（実経路: ${derived.lenAuto}m）`}
              </span>
            </div>
            <div style={{display:'flex',gap:4}}>
              <input className="pinput" type="number" value={conn.lenM||''} onChange={e=>upd({lenM:e.target.value})}
                placeholder={`自動: ${derived.lenAuto}`} style={{flex:1}}/>
              {!derived.lenIsAuto&&<button className="btn btn-ghost btn-sm" style={{padding:'2px 8px',fontSize:10}}
                title="上書きを解除して実経路長に戻します" onClick={()=>upd({lenM:''})}>↩ 自動</button>}
            </div>
          </div>
          {res&&<>
            <div className="gc">
              <div style={{fontSize:10,color:'#0891b2',fontWeight:700,marginBottom:3}}>
                推奨電線サイズ{derived.sizeIsAuto?'':' (上書き中)'}
              </div>
              <div className="gc-big">{derived.wireSize}</div>
              <div className="gc-row"><span>AWG {res.awg}</span><span>最大 {res.maxA}A</span></div>
              {(()=>{
                // 実際の電圧降下: Vd = I × 2L / (56 × S)。基準3%以内。
                const mm2=WIRE_SIZES.find(s=>s.label===derived.wireSize)?.mm2;
                const wv=wireVoltage(conn,nodes,systemV);
                if(!mm2||!derived.amps||!derived.lenM||!wv) return null;
                const vd=(2*derived.lenM*derived.amps)/(56*mm2);
                const pct=vd/wv*100;
                const col=pct<=3?'#16a34a':pct<=5?'#d97706':'#dc2626';
                const icon=pct<=3?'✅':pct<=5?'⚠':'❌';
                return(
                  <div className="gc-row" style={{marginTop:4,paddingTop:4,borderTop:'1px dashed #bae6fd'}}>
                    <span>電圧降下</span>
                    <span style={{color:col,fontWeight:700}}>{icon} {vd.toFixed(2)}V（{pct.toFixed(1)}%）</span>
                  </div>
                );
              })()}
            </div>
            {res.maxA<derived.amps&&<div className="gc-warn">⚠ 最大サイズで選定しています</div>}
            <div className="prow" style={{marginTop:8}}>
              <div className="plbl" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span>電線サイズを上書き<span style={{fontSize:9,color:'#94a3b8',marginLeft:4}}>KIV空中単線基準</span></span>
                {!derived.sizeIsAuto&&<button className="btn btn-ghost btn-sm" style={{padding:'2px 8px',fontSize:10}}
                  title="上書きを解除して自動推奨値に戻します" onClick={()=>upd({wireSize:''})}>↩ 自動</button>}
              </div>
              <select className="psel" value={conn.wireSize||''} onChange={e=>{
                const ws=e.target.value;
                upd({wireSize:ws});
              }}>
                <option value="">― 自動 ―</option>
                {WIRE_SIZES.map(w=><option key={w.mm2} value={w.label} style={{fontWeight:w.mm2===res.mm2?700:400}}>{w.label} (AWG{w.awg}, 最大{w.maxA}A){w.mm2===res.mm2?' ✓推奨':''}</option>)}
              </select>
            </div>
          </>}
          {fuse&&<div className="fc"><div style={{fontSize:10,color:'#c2410c',fontWeight:700,marginBottom:2}}>推奨ヒューズ</div><div className="fc-big">{fuse}A</div></div>}

          <div className="tip-box" style={{marginTop:8}}>中継点: {wpCount}個　◆ドラッグ=移動　⊕クリック=追加　◆ダブルクリック=削除</div>
          <div style={{display:'flex',gap:6,marginTop:8}}>
            {wpCount>0&&<button className="btn btn-warn btn-sm" style={{flex:1}} title="中継点をすべて削除し、自動迂回ルートに戻します"
              onClick={()=>upd({waypoints:[]})}>🔄 経路を再設定</button>}
            <button className="btn btn-danger btn-sm" style={{flex:wpCount>0?1:'1 1 100%'}} onClick={onDelSelected}>🗑 この配線を削除</button>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div className={cls}>
      <div className="psec">
        <div className="ptitle">操作ガイド</div>
        <div style={{fontSize:11.5,color:'#64748b',lineHeight:1.9}}>
          <div>• 部品をパレットからドラッグ&amp;ドロップ</div>
          <div>• ポート(●)クリック → 配線開始</div>
          <div>• 別ポートクリック → 接続完了</div>
          <div>• 部品本体をクリック or ESC → 描画キャンセル</div>
          <div>• 空白をクリック → 中継点を追加</div>
          <div>• 配線をタップ → 右パネルから色・太さ・削除</div>
          <div>• 配線を選択 → ⊕で中継点追加</div>
          <div>• 部品を選択 → 右下◤でリサイズ</div>
          <div>• 📱 スマホ: 配線を長押し → 再設定/削除メニュー</div>
          <div>• 🔍チェック → 電気的整合性を確認</div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  Check Modal
// ═══════════════════════════════════════════════════════════════
function CheckModal({nodes,connections,onClose,embedded}){
  const results=useMemo(()=>runChecks(nodes,connections),[nodes,connections]);
  const errCnt=results.filter(r=>r.level==='error').length;
  const warnCnt=results.filter(r=>r.level==='warn').length;

  const summary=errCnt>0
    ?{cls:'cs-err',icon:'❌',text:`${errCnt}件のエラー${warnCnt>0?`、${warnCnt}件の警告`:''}があります`}
    :warnCnt>0
    ?{cls:'cs-warn',icon:'⚠',text:`${warnCnt}件の警告があります`}
    :{cls:'cs-ok',icon:'✅',text:'問題は見つかりませんでした'};

  const LEVEL={ok:{cls:'chk-ok',icon:'✅'},warn:{cls:'chk-warn',icon:'⚠️'},error:{cls:'chk-err',icon:'❌'},info:{cls:'chk-info',icon:'ℹ️'}};

  // Group by category
  const cats=[...new Set(results.map(r=>r.cat))].filter(Boolean);

  const inner=(<>
        <div className="mbody">
          <div className={`check-summary ${summary.cls}`}>
            <span style={{fontSize:20}}>{summary.icon}</span>
            <span>{summary.text}</span>
          </div>
          {cats.map(cat=>(
            <div key={cat}>
              <div className="chk-cat">{cat}</div>
              {results.filter(r=>r.cat===cat).map((r,i)=>{
                const lv=LEVEL[r.level]||LEVEL.info;
                return(
                  <div key={i} className={`chk-item ${lv.cls}`}>
                    <span className="chk-icon">{lv.icon}</span>
                    <div>
                      <div className="chk-title">{r.title}</div>
                      {r.details?.length>0&&(
                        <div className="chk-details">
                          {r.details.map((d,j)=><div key={j} className="chk-detail-row">• {d}</div>)}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          ))}
          {results.filter(r=>!r.cat).map((r,i)=>{
            const lv=LEVEL[r.level]||LEVEL.info;
            return(
              <div key={i} className={`chk-item ${lv.cls}`}>
                <span className="chk-icon">{lv.icon}</span>
                <div>
                  <div className="chk-title">{r.title}</div>
                  {r.details?.length>0&&<div className="chk-details">{r.details.map((d,j)=><div key={j} className="chk-detail-row">• {d}</div>)}</div>}
                </div>
              </div>
            );
          })}
        </div>
        <div className="mfoot">
          <span style={{fontSize:11,color:'#94a3b8'}}>部品数: {nodes.length}　配線数: {connections.length}</span>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>閉じる</button>
        </div>
  </>);
  if(embedded) return inner;
  return(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal" style={{maxWidth:600}}>
        <div className="mhd">
          <div className="mttl">🔍 電気チェック結果</div>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button>
        </div>
        {inner}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
//  Simulation Modal
// ═══════════════════════════════════════════════════════════════
function SimModal({nodes,onClose,embedded}){
  // 入力パラメータ
  const [sunHours,setSunHours]=useState(()=>+(localStorage.getItem('sim_sun')||4));
  const [dod,setDod]=useState(()=>+(localStorage.getItem('sim_dod')||80));
  const [loadHours,setLoadHours]=useState(()=>{try{return JSON.parse(localStorage.getItem('sim_loadHrs')||'{}');}catch{return{};}});
  useEffect(()=>{localStorage.setItem('sim_sun',sunHours);},[sunHours]);
  useEffect(()=>{localStorage.setItem('sim_dod',dod);},[dod]);
  useEffect(()=>{localStorage.setItem('sim_loadHrs',JSON.stringify(loadHours));},[loadHours]);
  // 集計
  const sim=useMemo(()=>{
    const sols=nodes.filter(n=>n.type==='solar_panel');
    const bats=nodes.filter(n=>n.type==='battery');
    const dcLoads=nodes.filter(n=>n.type==='dc_load');
    const acLoads=nodes.filter(n=>n.type==='ac_load');
    const solarW=sols.reduce((s,n)=>s+(+n.props.watts||0),0);
    // 太陽光発電効率: 75% (MPPT損失、温度、汚れなど)
    const solarDayWh=solarW*sunHours*0.75;
    const battTotalWh=bats.reduce((s,n)=>s+(+n.props.voltage||12)*(+n.props.ah||0),0);
    const battUsableWh=battTotalWh*(dod/100);
    const loads=[...dcLoads,...acLoads].map(n=>{
      const w=+n.props.watts||0;
      const h=loadHours[n.id]!=null?+loadHours[n.id]:2;
      // AC負荷はインバーター効率0.85
      const eff=n.type==='ac_load'?0.85:1;
      const dayWh=w*h/eff;
      return{node:n,w,h,dayWh,isAC:n.type==='ac_load'};
    });
    const loadDayWh=loads.reduce((s,l)=>s+l.dayWh,0);
    const peakW=loads.reduce((s,l)=>s+l.w/(l.isAC?0.85:1),0);
    const autonomyDays=loadDayWh>0?battUsableWh/loadDayWh:Infinity;
    const selfSuf=loadDayWh>0?(solarDayWh/loadDayWh)*100:Infinity;
    const rechargeHours=solarDayWh>0?battUsableWh/(solarW*0.75):Infinity;
    const dailyBalance=solarDayWh-loadDayWh;
    return{sols,bats,dcLoads,acLoads,solarW,solarDayWh,battTotalWh,battUsableWh,loads,loadDayWh,peakW,autonomyDays,selfSuf,rechargeHours,dailyBalance};
  },[nodes,sunHours,dod,loadHours]);
  // ステータス判定
  const autonomyCls=sim.autonomyDays>=2?'sim-stat-good':sim.autonomyDays>=1?'sim-stat-warn':'sim-stat-bad';
  const selfSufCls=sim.selfSuf>=100?'sim-stat-good':sim.selfSuf>=70?'sim-stat-warn':'sim-stat-bad';
  const balanceCls=sim.dailyBalance>=0?'sim-stat-good':sim.dailyBalance>=-sim.loadDayWh*0.3?'sim-stat-warn':'sim-stat-bad';
  const fmt=n=>!isFinite(n)?'∞':n>=100?Math.round(n).toLocaleString():n.toFixed(1);
  // 自立日数の表示: 1日未満なら時間、1日以上なら "X日Y時間"
  const fmtAutonomy=d=>{
    if(!isFinite(d)) return{val:'∞',unit:''};
    if(d<=0) return{val:'0',unit:'時間'};
    if(d<1){
      const hrs=d*24;
      return{val:hrs>=10?Math.round(hrs).toString():hrs.toFixed(1),unit:'時間'};
    }
    const days=Math.floor(d);
    const remHrs=Math.round((d-days)*24);
    if(remHrs===0) return{val:days.toString(),unit:'日'};
    if(remHrs>=24) return{val:(days+1).toString(),unit:'日'};
    return{val:`${days}日${remHrs}`,unit:'時間'};
  };
  const inner=(<>
        <div className="mbody">
          {nodes.length===0?<div style={{textAlign:'center',color:'#94a3b8',padding:48}}>キャンバスに部品を配置してください</div>:<>
            {/* 主要指標 */}
            <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:8,marginBottom:14}}>
              <div className={`sim-stat ${autonomyCls}`} title="バッテリーだけで何日もつかを表す指標（ソーラー発電は含めない）。連続曇天など最悪ケースの備え。推奨：2〜3日以上。&#10;計算式：実用バッテリー容量 ÷ 1日の消費量&#10;緑=2日以上 / 黄=1〜2日 / 赤=1日未満">
                {(()=>{const a=fmtAutonomy(sim.autonomyDays);return(
                  <div className="sim-stat-val" style={{fontSize:a.val.length>4?18:24}}>{a.val}<span style={{fontSize:12,marginLeft:3}}>{a.unit}</span></div>
                );})()}
                <div className="sim-stat-lbl">📉 自立日数 <span style={{opacity:.6}}>ⓘ</span></div>
              </div>
              <div className={`sim-stat ${selfSufCls}`} title="日々の消費電力をソーラー発電だけでまかなえる割合。&#10;計算式：1日の発電量 ÷ 1日の消費量 × 100&#10;100%以上で「日々の電力を太陽光だけで自給できる」状態。&#10;緑=100%以上 / 黄=70〜100% / 赤=70%未満">
                <div className="sim-stat-val">{fmt(sim.selfSuf)}<span style={{fontSize:12,marginLeft:3}}>%</span></div>
                <div className="sim-stat-lbl">☀ 自給率 <span style={{opacity:.6}}>ⓘ</span></div>
              </div>
              <div className={`sim-stat ${balanceCls}`} title="1日あたりの余剰/不足電力（Wh）。&#10;計算式：1日の発電量 − 1日の消費量&#10;プラスなら余裕、マイナスなら毎日バッテリーを切り崩している状態。&#10;緑=プラス / 黄=やや不足 / 赤=大幅不足">
                <div className="sim-stat-val">{sim.dailyBalance>=0?'+':''}{fmt(sim.dailyBalance)}<span style={{fontSize:12,marginLeft:3}}>Wh</span></div>
                <div className="sim-stat-lbl">⚖ 日収支 <span style={{opacity:.6}}>ⓘ</span></div>
              </div>

                    • 自立日数 ≥ 2〜3日（曇天への備え）<br/>
