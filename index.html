function BOMModal({nodes,connections,affiliateTag,systemV=12,onClose,embedded}){
  // 容量・仕様別にグループ化（同じ部品でも 100Ah と 200Ah は別行）
  const tally=useMemo(()=>{const m={};nodes.forEach(n=>{const d=COMP[n.type];const q=amazonQuery(n);const k=`${n.type}|${q}`;if(!m[k])m[k]={type:n.type,d,query:q,count:0,nodes:[]};m[k].count++;m[k].nodes.push(n);});return Object.values(m);},[nodes]);
  // サイズ別に本数と合計長(m)を集計。購入目安は端子処理・取り回し余裕をみて +20%
  const wireTally=useMemo(()=>{
    const m={};
    connections.forEach(c=>{
      const d=getDerivedWire(c,nodes,connections,systemV,null);
      if(!d.wireSize) return;
      if(!m[d.wireSize]) m[d.wireSize]={cnt:0,len:0};
      m[d.wireSize].cnt++;
      m[d.wireSize].len+=(+d.lenM||0); // ±は別配線として計上済みなので片道長を単純合計
    });
    return Object.entries(m).map(([s,v])=>({size:s,cnt:v.cnt,len:Math.round(v.len*10)/10,buy:Math.ceil(v.len*1.2*2)/2}));
  },[connections,nodes,systemV]);
  const total=tally.reduce((s,t)=>s+t.d.priceEst*t.count,0);
  // 強化版CTAボタン: メインリンク + サブリンク（高評価/価格安い順）
  const renderAffCta=(query,price,count,key)=>{
    if(!query) return'—';
    const subtotal=(price||0)*(count||1);
    return(
      <div>
        <a className="aff-primary" href={affLink(query,affiliateTag)} target="_blank" rel="noopener">
          <span className="pri-top">🛒 Amazonで探す</span>
          {subtotal>0&&<span className="pri-sub">合計目安 ¥{subtotal.toLocaleString()}〜<span className="prime-badge">Prime</span></span>}
        </a>
        <div className="aff-alts">
          <a className="aff-alt" href={affLink(query,affiliateTag,'review-rank')} target="_blank" rel="noopener" title="レビュー評価の高い順">★高評価</a>
          <a className="aff-alt" href={affLink(query,affiliateTag,'price-asc-rank')} target="_blank" rel="noopener" title="価格の安い順">最安値</a>
          <a className="aff-alt" href={affLinkPrime(query,affiliateTag)} target="_blank" rel="noopener" title="Prime対応のみ">Prime限定</a>
        </div>
      </div>
    );
  };
  // 全部まとめて新規タブで開く（機器・配線材・工具すべて）
  const openAllAmazon=()=>{
    const links=[];
    tally.filter(t=>t.d.affKey&&t.query).forEach(t=>links.push(t.query));
    wireTally.forEach(w=>{const mm2=w.size.replace('mm²','').trim();const a=WIRE_AFF.find(x=>x.mm2===mm2);if(a)links.push(a.q);});
    TOOL_AFF.forEach(t=>links.push(t.q));
    links.forEach((q,i)=>{
      setTimeout(()=>window.open(affLink(q,affiliateTag),'_blank','noopener'),i*100);
    });
  };
  const inner=(<>
        <div className="mbody">
          {tally.length===0?<div style={{textAlign:'center',color:'#94a3b8',padding:48}}>キャンバスに部品を配置してください</div>:<>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
              <div style={{fontWeight:700,fontSize:13}}>🔧 機器・部品</div>
              {total>0&&<div style={{fontSize:11,color:'#64748b'}}>合計概算 <b style={{color:'#dd8c1a',fontSize:14}}>¥{total.toLocaleString()}〜</b></div>}
            </div>
            <table className="bom-tbl">
              <thead><tr><th>部品名</th><th>仕様</th><th style={{textAlign:'center'}}>必要数</th><th>小計</th><th style={{minWidth:160}}>Amazon で購入</th></tr></thead>
              <tbody>{tally.map((t,i)=>(
                <tr key={i}>
                  <td><div style={{display:'flex',alignItems:'center',gap:10}}>
                    <ProductThumb type={t.type} node={t.nodes[0]} size={48}/>
                    <span style={{fontWeight:600}}>{t.d.label}</span>
                  </div></td>
                  <td><span style={{fontSize:11,color:'#64748b'}}>{specLine(t.nodes[0])}</span></td>
                  <td style={{textAlign:'center'}}><span style={{fontWeight:700,color:'#dd8c1a'}}>× {t.count}</span></td>
                  <td>{t.d.priceEst>0?<span className="subtotal-cell"><span className="qty-x">¥{t.d.priceEst.toLocaleString()}×{t.count}=</span>¥{(t.d.priceEst*t.count).toLocaleString()}</span>:<span style={{color:'#cbd5e1'}}>—</span>}</td>
                  <td>{t.d.affKey?renderAffCta(t.query,t.d.priceEst,t.count,'p'+i):'—'}</td>
                </tr>
              ))}</tbody>
            </table>
            {wireTally.length>0&&<>
              <div style={{fontWeight:700,fontSize:13,margin:'18px 0 10px'}}>🔌 配線材</div>
              <table className="bom-tbl bom-wire">
                <thead><tr><th>電線サイズ</th><th>使用箇所 / 必要長</th><th style={{minWidth:160}}>Amazon で購入</th></tr></thead>
                <tbody>{wireTally.map((w,i)=>{const mm2=w.size.replace('mm²','').trim();const a=WIRE_AFF.find(x=>x.mm2===mm2)||{q:`電線 ${w.size}`};return(
                  <tr key={i}>
                    <td><div style={{display:'flex',alignItems:'center',gap:10}}>
                      <ThumbBox icon={WIRE_THUMB.icon} color={WIRE_THUMB.color} bg={WIRE_THUMB.bg} label={w.size} size={42}/>
                      <span style={{fontWeight:600}}>{w.size}</span>
                    </div></td>
                    <td>
                      {w.cnt}箇所{w.len>0&&<> / 約{w.len}m</>}
                      {w.len>0&&<div style={{fontSize:10,color:'#94a3b8'}}>購入目安 {w.buy}m（+20%余裕）</div>}
                    </td>
                    <td>{renderAffCta(a.q,0,1,'w'+i)}</td>
                  </tr>
                );})}</tbody>
              </table>
              <div style={{fontSize:10,color:'#94a3b8',marginTop:4}}>※ 必要長は各配線の「ケーブル長」の合計。実測値の入力を推奨します（未入力は画面上の経路から概算）</div>
            </>}
            <div style={{fontWeight:700,fontSize:13,margin:'18px 0 10px'}}>🛠 工具・消耗品</div>
            <table className="bom-tbl bom-wire">
              <thead><tr><th>品名</th><th></th><th style={{minWidth:160}}>Amazon で購入</th></tr></thead>
              <tbody>{TOOL_AFF.map((t,i)=>(
                <tr key={i}>
                  <td><div style={{display:'flex',alignItems:'center',gap:10}}>
                    <ThumbBox icon={t.icon||'🛠'} color={t.color||'#475569'} bg={t.bg||'#e2e8f0'} label={t.n} size={42}/>
                    <span style={{fontWeight:600}}>{t.n}</span>
                  </div></td>
                  <td/>
                  <td>{renderAffCta(t.q,0,1,'t'+i)}</td>
                </tr>
              ))}</tbody>
            </table>
            <div style={{marginTop:18,padding:14,background:'linear-gradient(180deg,#fef3c7,#fde68a)',borderRadius:10,border:'1px solid #fbbf24',textAlign:'center'}}>
              <div style={{fontSize:12,color:'#78350f',marginBottom:8,fontWeight:600}}>🛒 設計に必要な部品をまとめて確認できます</div>
              <button className="aff-bulk" onClick={openAllAmazon} title="機器・配線材・工具すべてを Amazon 検索で新しいタブに開きます">
                🛒 全部まとめて Amazon で確認する（{tally.filter(t=>t.d.affKey).length+wireTally.length+TOOL_AFF.length}件）
              </button>
              <div style={{fontSize:10,color:'#92400e',marginTop:6}}>※ ブラウザのポップアップ許可が必要な場合があります</div>
            </div>
          </>}
        </div>
        <div className="mfoot">
          <span style={{fontSize:12,color:'#94a3b8'}}>{total>0?`部品合計参考: ¥${total.toLocaleString()}〜`:''}</span>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-ghost btn-sm" onClick={()=>navigator.clipboard?.writeText(tally.map(t=>`${t.d.label}（${specLine(t.nodes[0])}）×${t.count}`).join('\n'))}>📋 リストをコピー</button>
            <button className="btn btn-ghost btn-sm" onClick={onClose}>閉じる</button>
          </div>
        </div>
  </>);
  if(embedded) return inner;
  return(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <div className="mhd"><div className="mttl">📋 部品一覧 &amp; アフィリエイトリンク</div><button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button></div>
        {inner}
      </div>
    </div>
  );
}
// チェック / 試算 / 部品一覧 を1つのモーダルにタブ統合した「設計レビュー」
function ReviewModal({nodes,connections,affiliateTag,systemV=12,initialTab='check',onClose}){
  const[tab,setTab]=useState(initialTab);
  const badge=useMemo(()=>{
    const r=runChecks(nodes,connections);
    const e=r.filter(x=>x.level==='error').length;
    const w=r.filter(x=>x.level==='warn').length;
    return e+w>0?{n:e+w,err:e>0}:null;
  },[nodes,connections]);
  const TABS=[
    {k:'check',label:<>🔍 チェック{badge&&<span className={`rev-badge${badge.err?' err':''}`}>{badge.n}</span>}</>},
    {k:'sim',label:'🔬 試算'},
    {k:'bom',label:'📋 部品一覧'},
  ];
  return(
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <div className="mhd">
          <div className="rev-tabs">
            {TABS.map(t=>(
              <button key={t.k} className={`rev-tab${tab===t.k?' on':''}`} onClick={()=>setTab(t.k)}>{t.label}</button>
            ))}
          </div>
          <button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button>
        </div>
        {tab==='check'&&<CheckModal nodes={nodes} connections={connections} onClose={onClose} embedded/>}
        {tab==='sim'&&<SimModal nodes={nodes} onClose={onClose} embedded/>}
        {tab==='bom'&&<BOMModal nodes={nodes} connections={connections} affiliateTag={affiliateTag} systemV={systemV} onClose={onClose} embedded/>}
      </div>
    </div>
  );
}
function SettModal({affiliateTag,onSave,onClose}){
  const[tag,setTag]=useState(affiliateTag);
  return(<div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}><div className="modal" style={{maxWidth:440}}><div className="mhd"><div className="mttl">⚙ 設定</div><button className="btn btn-ghost btn-sm" onClick={onClose}>✕</button></div><div className="mbody"><div className="srow"><div className="slbl">Amazon アソシエイトタグ</div><div className="sdesc">例: <code>yourname-22</code></div><input className="sinput" value={tag} onChange={e=>setTag(e.target.value)} placeholder="例: yourname-22"/></div></div><div className="mfoot"><span/><div style={{display:'flex',gap:8}}><button className="btn btn-ghost btn-sm" onClick={onClose}>キャンセル</button><button className="btn btn-primary btn-sm" onClick={()=>{onSave(tag);onClose();}}>保存</button></div></div></div></div>);
}

// ═══════════════════════════════════════════════════════════════
//  App
// ═══════════════════════════════════════════════════════════════
function App(){
  const[nodes,setNodes]=useState([]);
  const[conns,setConns]=useState([]);
  const[selected,setSelected]=useState(null);
  const[portEditNode,setPEN]=useState(null);
  const[ix,setIx]=useState(null);
  // 常に最新の ix を参照するための ref（React state コミット遅延を避ける）
  const ixRef=React.useRef(null);
  ixRef.current=ix;
  // 配線長押し直後の click を抑制するためのフラグ
  const wireLongPressRef=React.useRef(null);
  const[portPreview,setPortPrev]=useState(null);
  const[ghostPos,setGhost]=useState(null);
  const[review,setReview]=useState(null);      // 設計レビューモーダル: null | 'check' | 'sim' | 'bom'
  const[fileMenu,setFileMenu]=useState(false); // ファイルメニュー開閉
  const[showSett,setShowSett]=useState(false);
  const[palOpen,setPalOpen]=useState(false);   // モバイル用パレット開閉
  const[panOpen,setPanOpen]=useState(false);   // モバイル用右パネル開閉
  const[systemV,setSystemV]=useState(12);
  const[affTag,setAffTag]=useState(()=>DEPLOY_AFF_TAG||localStorage.getItem('aff_tag')||'');
  const isDeployed=!!DEPLOY_AFF_TAG; // 公開モード（設定UIを隠す）
  const[wireStyle,setWireStyle]=useState('click'); // 'curve' | 'straight' | 'ortho' | 'click'（デフォルト：クリック式）
  const[toast,setToast]=useState(null);
  // 中央表示の確認ダイアログ：{title?,message,onOK,okLabel?,cancelLabel?} | null
  const[confirmDlg,setConfirmDlg]=useState(null);
  // ── キャンバスのズーム/パン ──
  const[zoom,setZoom]=useState(1);
  const[pan,setPan]=useState({x:0,y:0});
  const zoomRef=useRef(1); zoomRef.current=zoom;
  const panRef=useRef({x:0,y:0}); panRef.current=pan;
  const canvasRef=useRef(null);
  const loadRef=useRef(null);
  // スクリーン座標 → デザイン座標
  const c2d=(cx,cy)=>{
    const r=canvasRef.current?.getBoundingClientRect();
    if(!r) return{x:cx,y:cy};
    return{x:(cx-r.left-panRef.current.x)/zoomRef.current,y:(cy-r.top-panRef.current.y)/zoomRef.current};
  };

  // ── Undo / Redo ──
  const hist=useRef([{nodes:[],conns:[]}]);
  const histIdx=useRef(0);
  const [histVer,setHistVer]=useState(0); // triggers re-render for button state
  // Always-current refs (safe to read inside event handlers)
  const nodesRef=useRef(nodes);
  const connsRef=useRef(conns);
  nodesRef.current=nodes;
  connsRef.current=conns;

  const pushHist=useCallback((ns,cs)=>{
    const snap={nodes:JSON.parse(JSON.stringify(ns)),conns:JSON.parse(JSON.stringify(cs))};
    hist.current=[...hist.current.slice(0,histIdx.current+1),snap];
    histIdx.current=hist.current.length-1;
    setHistVer(v=>v+1);
  },[]);
  const undo=useCallback(()=>{
    // クリックモードで描画中：直前 waypoint を取消（履歴ではなく描画コンテキストの undo）
    const cur=ixRef.current;
    if(cur?.mode==='drawWire'&&cur.clickMode){
      const wps=cur.waypoints||[];
      if(wps.length>0){
        setIx({...cur,waypoints:wps.slice(0,-1)});
        return;
      }
      // waypoint 0個 → 描画キャンセル
      setIx(null);setGhost(null);
      return;
    }
    if(histIdx.current<=0) return;
    histIdx.current--;
    const snap=hist.current[histIdx.current];
    // 描画中・操作中の ix/ghost をクリア（undo時にstaleなnodeIdを参照しないように）
    setIx(null);setGhost(null);
    setNodes(snap.nodes);setConns(snap.conns);setSelected(null);setPEN(null);
    setHistVer(v=>v+1);
  },[]);
  const redo=useCallback(()=>{
    if(histIdx.current>=hist.current.length-1) return;
    histIdx.current++;
    const snap=hist.current[histIdx.current];
    setIx(null);setGhost(null);
    setNodes(snap.nodes);setConns(snap.conns);setSelected(null);setPEN(null);
    setHistVer(v=>v+1);
  },[]);
  const canUndo=histIdx.current>0;
  const canRedo=histIdx.current<hist.current.length-1;

  // Keyboard shortcuts: Ctrl+Z / Ctrl+Y / Ctrl+Shift+Z
  useEffect(()=>{
    const h=e=>{
      const tag=document.activeElement?.tagName;
      if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return; // don't intercept text input
      if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}
      else if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();redo();}
    };
    document.addEventListener('keydown',h);
    return()=>document.removeEventListener('keydown',h);
  },[undo,redo]);

  // Quick check badge (error/warn count for header)
  const checkBadge=useMemo(()=>{
    if(nodes.length===0) return null;
    const r=runChecks(nodes,conns);
    const e=r.filter(x=>x.level==='error').length;
    const w=r.filter(x=>x.level==='warn').length;
    if(e>0) return{text:`❌ ${e}`,color:'#ef4444'};
    if(w>0) return{text:`⚠ ${w}`,color:'#f59e0b'};
    return{text:'✅',color:'#22c55e'};
  },[nodes,conns]);

  useEffect(()=>{if(!isDeployed)localStorage.setItem('aff_tag',affTag);},[affTag,isDeployed]);
  useEffect(()=>{localStorage.setItem('offgrid_v3',JSON.stringify({nodes,conns,systemV,wireStyle}));},[nodes,conns,systemV,wireStyle]);
  useEffect(()=>{
    // 共通: d(nodes/conns/systemV) を検証つきで反映
    const applyDesign=d=>{
      const ns=d.nodes?d.nodes.map(n=>({...n,portPositions:n.portPositions||{}})):[];
      bumpGid(ns,null);
      const csRaw=d.conns?d.conns.map(c=>({wireColor:'#94a3b8',customThick:null,...c,waypoints:c.waypoints||(c.bendHandle?[c.bendHandle]:[]),bendHandle:undefined})):[];
      const cs=dedupeConnIds(csRaw);
      if(d.nodes)setNodes(ns);
      if(d.conns)setConns(cs);
      if(d.systemV)setSystemV(d.systemV);
      bumpGid(ns,cs);
      // 配線スタイルはクリックをデフォルトに（既存配線は c.style を尊重して描画）
      setWireStyle('click');
      // Initialize history with the loaded state (so undo doesn't go past initial load)
      hist.current=[{nodes:JSON.parse(JSON.stringify(ns)),conns:JSON.parse(JSON.stringify(cs))}];
      histIdx.current=0;
    };
    // 1) 共有URL (#d=...) があれば最優先で読み込み
    const m=location.hash.match(/^#d=([A-Za-z0-9_\-]+)$/);
    if(m){
      decodeShareData(m[1])
        .then(d=>{applyDesign(d);showToast('共有された回路を読み込みました');})
        .catch(()=>{showToast('共有リンクの読み込みに失敗しました');});
      return;
    }
    // 2) 通常はローカル保存から復元
    try{
      const raw=localStorage.getItem('offgrid_v3')||localStorage.getItem('offgrid_v2');
      if(raw) applyDesign(JSON.parse(raw));
    }catch(e){}
  },[]);

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),2000);};

  // ── 共有リンク（回路データをURLハッシュに埋め込む。サーバー不要） ──
  const shareLink=async()=>{
    if(nodes.length===0){showToast('共有する回路がありません');return;}
    try{
      const enc=await encodeShareData({nodes,conns,systemV,wireStyle});
      const url=`${location.origin}${location.pathname}#d=${enc}`;
      await navigator.clipboard.writeText(url);
      showToast(`共有リンクをコピーしました（${Math.round(url.length/100)/10}KB）`);
    }catch(err){showToast('共有リンクの作成に失敗: '+err.message);}
  };

  // ── JSON Save / Load ──
  const saveJSON=()=>{
    const data=JSON.stringify({nodes,conns,systemV,wireStyle},null,2);
    const blob=new Blob([data],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='offgrid-design.json'; a.click();
    URL.revokeObjectURL(url); showToast('保存しました');
  };
  // PNG/PDF エクスポート
  const captureCanvas=async()=>{
    if(typeof html2canvas==='undefined'){showToast('エクスポートライブラリ読込中...');return null;}
    const el=canvasRef.current; if(!el) return null;
    // 一旦選択解除（ハイライト残らないように）
    setSelected(null); setPEN(null);
    await new Promise(r=>setTimeout(r,50));
    return html2canvas(el,{backgroundColor:'#f8fafc',scale:2,logging:false,useCORS:true});
  };
  const exportPNG=async()=>{
    showToast('画像を生成中...');
    try{
      const canvas=await captureCanvas(); if(!canvas) return;
      const a=document.createElement('a');
      a.download=`offgrid-design-${new Date().toISOString().slice(0,10)}.png`;
      a.href=canvas.toDataURL('image/png'); a.click();
      showToast('PNG をダウンロードしました');
    }catch(err){console.error(err);showToast('エクスポート失敗: '+err.message);}
  };
  const exportPDF=async()=>{
    showToast('PDF を生成中...');
    try{
      const canvas=await captureCanvas(); if(!canvas) return;
      if(!window.jspdf){showToast('PDFライブラリ読込中、再度お試しください');return;}
      const {jsPDF}=window.jspdf;
      // 横向き、A4 サイズで配置
      const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
      const pw=297, ph=210;
      const imgRatio=canvas.height/canvas.width;
      let w=pw-20, h=w*imgRatio;
      if(h>ph-20){h=ph-20; w=h/imgRatio;}
      const x=(pw-w)/2, y=20;
      // タイトル
      pdf.setFontSize(14); pdf.text('Offgrid Electrical Design',pw/2,12,{align:'center'});
      pdf.setFontSize(8); pdf.text(`Generated: ${new Date().toLocaleString('ja-JP')} / System: ${systemV}V / Parts: ${nodes.length} / Wires: ${conns.length}`,pw/2,17,{align:'center'});
      pdf.addImage(canvas.toDataURL('image/png'),'PNG',x,y,w,h);
      pdf.save(`offgrid-design-${new Date().toISOString().slice(0,10)}.pdf`);
      showToast('PDF をダウンロードしました');
    }catch(err){console.error(err);showToast('エクスポート失敗: '+err.message);}
  };
  const loadJSON=e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        const loadedNodes=d.nodes?d.nodes.map(n=>({...n,portPositions:n.portPositions||{}})):[];
        if(d.nodes)setNodes(loadedNodes);
        // 先にカウンターをノード基準で更新してから配線IDの重複を解消（新IDが既存ノードIDと被らないように）
        bumpGid(loadedNodes,null);
        const rawConns=d.conns?d.conns.map(c=>({wireColor:'#94a3b8',customThick:null,...c,waypoints:c.waypoints||(c.bendHandle?[c.bendHandle]:[]),bendHandle:undefined})):[];
        const loadedConns=dedupeConnIds(rawConns);
        if(d.conns)setConns(loadedConns);
        if(d.systemV)setSystemV(d.systemV);
        // 配線IDも考慮して再度カウンターを進める（以降の新規配線がぶつからないように）
        bumpGid(loadedNodes,loadedConns);
        // 配線スタイルはクリックをデフォルトに（既存配線は c.style を尊重して描画）
        setWireStyle('click');
        setSelected(null); setPEN(null);
        // 読込結果を履歴に登録（直後の Undo でキャンバスが空に戻らないように）
        pushHist(loadedNodes,loadedConns);
        showToast('読み込みました');
      }catch(err){showToast('読み込みエラー');}
    };
    r.readAsText(f); e.target.value='';
  };

  const onDragOver=e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';};
  // 配置位置が既存ノードと重なる場合は階段状にオフセット
  const findNonOverlapPos=(x,y,w,h)=>{
    const ns=nodesRef.current;
    let cx=x, cy=y;
    for(let i=0;i<30;i++){
      const overlap=ns.some(n=>{
        const {w:nw,h:nh}=nodeEffSize(n);
        return cx<n.x+nw&&cx+w>n.x&&cy<n.y+nh&&cy+h>n.y;
      });
      if(!overlap) return{x:cx,y:cy};
      cx+=24; cy+=24;
    }
    return{x:cx,y:cy};
  };
  const onDrop=e=>{
    e.preventDefault(); const type=e.dataTransfer.getData('compType');
    if(!type||!COMP[type]) return;
    const d=COMP[type];
    const dp=c2d(e.clientX,e.clientY);
    // ドロップ時の上限解除：負座標も許可
    const wantX=dp.x-d.w/2;
    const wantY=dp.y-d.h/2;
    const{x,y}=findNonOverlapPos(wantX,wantY,d.w,d.h);
    const newNode={id:uid(),type,x,y,props:{...d.defaultProps},portPositions:{}};
    const newNodes=[...nodesRef.current,newNode];
    setNodes(newNodes);
    setSelected({type:'node',id:newNode.id});
    pushHist(newNodes,connsRef.current);
  };

  const onPortMouseDown=useCallback((e,nodeId,portId)=>{
    e.preventDefault();
    if(portEditNode===nodeId){setIx({mode:'movePort',nodeId,portId});return;}
    // 最新の ix を参照（closure の古い値ではなく ref を見る）
    const cIx=ixRef.current;
    // クリックモード描画中：別ポートをクリックなら finalize、同じポートならキャンセル
    if(cIx?.mode==='drawWire'&&cIx.clickMode){
      if(cIx.nodeId===nodeId&&cIx.portId===portId){setIx(null);setGhost(null);return;}
      // 再設定モード中は対象配線そのものを除外して exists 判定
      const exists=connsRef.current.some(c=>c.id!==cIx.replaceConnId&&((c.fromNode===cIx.nodeId&&c.fromPort===cIx.portId&&c.toNode===nodeId&&c.toPort===portId)||(c.toNode===cIx.nodeId&&c.toPort===cIx.portId&&c.fromNode===nodeId&&c.fromPort===portId)));
      if(!exists){
        const ns=nodesRef.current;
        const fromN=ns.find(n=>n.id===cIx.nodeId);
        const toN=ns.find(n=>n.id===nodeId);
        const fromPC=fromN?getNodePorts(fromN).find(p=>p.id===cIx.portId)?.color:null;
        const toPC=toN?getNodePorts(toN).find(p=>p.id===portId)?.color:null;
        let wcolor='#94a3b8';
        if(fromPC==='#ef4444'&&toPC==='#ef4444') wcolor='#ef4444';
        else if(fromPC==='#374151'&&toPC==='#374151') wcolor='#1f2937';
        const newConn={id:uid(),fromNode:cIx.nodeId,fromPort:cIx.portId,toNode:nodeId,toPort:portId,amps:'',lenM:'',wireSize:'',wireColor:wcolor,customThick:null,waypoints:cIx.waypoints||[],style:'click'};
        // 再設定モード（replaceConnId あり）：旧配線を削除して新配線を追加
        const baseConns=cIx.replaceConnId?connsRef.current.filter(x=>x.id!==cIx.replaceConnId):connsRef.current;
        const newConns=[...baseConns,newConn];
        setConns(newConns);
        pushHist(nodesRef.current,newConns);
        showToast(cIx.replaceConnId?'配線を再設定しました':'接続しました');
      }
      setIx(null);setGhost(null);return;
    }
    // 通常モード or 新規描画開始：クリックモードなら clickMode フラグを立てる
    setIx({mode:'drawWire',nodeId,portId,clickMode:wireStyle==='click',waypoints:[]});
  },[portEditNode,wireStyle]);

  const onPortMouseUp=useCallback((nodeId,portId)=>{
    if(ix?.mode!=='drawWire') return;
    // クリックモードでは pointerup では finalize しない（クリック式は onPortMouseDown で処理）
    if(ix.clickMode) return;
    if(ix.nodeId===nodeId&&ix.portId===portId){setIx(null);setGhost(null);return;}
    const exists=conns.some(c=>(c.fromNode===ix.nodeId&&c.fromPort===ix.portId&&c.toNode===nodeId&&c.toPort===portId)||(c.toNode===ix.nodeId&&c.toPort===ix.portId&&c.fromNode===nodeId&&c.fromPort===portId));
    if(!exists){
      const ns=nodesRef.current;
      const fromN=ns.find(n=>n.id===ix.nodeId);
      const toN=ns.find(n=>n.id===nodeId);
      const fromPC=fromN?getNodePorts(fromN).find(p=>p.id===ix.portId)?.color:null;
      const toPC=toN?getNodePorts(toN).find(p=>p.id===portId)?.color:null;
      let wcolor='#94a3b8';
      if(fromPC==='#ef4444'&&toPC==='#ef4444') wcolor='#ef4444';
      else if(fromPC==='#374151'&&toPC==='#374151') wcolor='#1f2937';
      const newConn={id:uid(),fromNode:ix.nodeId,fromPort:ix.portId,toNode:nodeId,toPort:portId,amps:'',lenM:'',wireSize:'',wireColor:wcolor,customThick:null,waypoints:[]};
      const newConns=[...conns,newConn];
      setConns(newConns);
      pushHist(nodesRef.current,newConns);
      showToast('接続しました（電流・長さ・サイズは自動計算されます）');
    }
    setIx(null);setGhost(null);
  },[ix,conns,systemV]);

  // モバイル時、選択中のノードを上半分に自動配置してパネルを開く
  const openPanelForNode=useCallback((nodeId)=>{
    if(!canvasRef.current) return;
    const node=nodesRef.current.find(n=>n.id===nodeId); if(!node) return;
    const r=canvasRef.current.getBoundingClientRect();
    const{w:nw,h:nh}=nodeEffSize(node);
    const z=zoomRef.current;
    const isMobile=window.innerWidth<=700;
    const visibleH=isMobile?Math.max(120,r.height*0.45):r.height;
    setPan({x:r.width/2-(node.x+nw/2)*z,y:visibleH/2-(node.y+nh/2)*z});
    setPanOpen(true);
  },[]);

  const onNodeMouseDown=useCallback((e,nodeId)=>{
    if(ix?.mode==='drawWire') return;
    e.stopPropagation();
    const node=nodes.find(n=>n.id===nodeId);
    setSelected({type:'node',id:nodeId});
    const dp=c2d(e.clientX,e.clientY);
    // origX/Y を保存しておき、pointerup 時に「タップだったか / ドラッグだったか」を判定
    setIx({mode:'moveNode',nodeId,ox:dp.x-node.x,oy:dp.y-node.y,origX:node.x,origY:node.y});
  },[nodes,ix]);

  const onBendMouseDown=useCallback((e,connId,wpIndex)=>{e.stopPropagation();setIx({mode:'moveBend',connId,wpIndex});},[]);

  // ── 配線セグメントのドラッグ（垂直方向への平行移動）──
  const onWireSegMouseDown=useCallback((e,connId)=>{
    // 描画中（特に再設定モード）はセグメントドラッグを抑制
    if(ix?.mode==='drawWire') return;
    if(ix&&ix.mode!=='drawWire') return;
    const cs=connsRef.current; const ns=nodesRef.current;
    const conn=cs.find(c=>c.id===connId); if(!conn) return;
    // セグメントのドラッグは ortho 自動ルーティングのみ対応（click 式は手動編集）
    if((conn.style||'ortho')!=='ortho') return;
    const dp=c2d(e.clientX,e.clientY);
    const cx=dp.x, cy=dp.y;
    // 仮想pts（中継点なしの場合は描画上の角を含めて構築）
    const hasWps=conn.waypoints&&conn.waypoints.length>0;
    let virtualPts, needsConversion=false;
    if(hasWps){
      virtualPts=connPts(conn,ns);
    } else {
      const prevSegs=[];
      for(const c of cs){
        if(c.id===connId) break;
        const cPts=connPts(c,ns); if(!cPts) continue;
        const r=buildPath(cPts,wireStyle,ns,c.fromNode,c.toNode,c.fromPort,c.toPort,prevSegs);
        prevSegs.push(...r.segs);
      }
      const myPts=connPts(conn,ns); if(!myPts) return;
      const r=buildPath(myPts,wireStyle,ns,conn.fromNode,conn.toNode,conn.fromPort,conn.toPort,prevSegs);
      const rawC=r.segs.slice(0,-1).map(s=>({x:s.bx,y:s.by}));
      const corners=[];
      for(const c of rawC){const l=corners[corners.length-1];if(!l||Math.abs(l.x-c.x)>0.5||Math.abs(l.y-c.y)>0.5)corners.push(c);}
      virtualPts=[myPts[0],...corners,myPts[myPts.length-1]];
      needsConversion=true;
    }
    if(!virtualPts||virtualPts.length<2) return;
    // 最も近い「ドラッグ可能なサブセグメント」を探す（H-V経路想定）
    let best=null, bestD=Infinity;
    for(let i=0;i<virtualPts.length-1;i++){
      const p=virtualPts[i], q=virtualPts[i+1];
      // H サブセグメント: y=p.y, x in [p.x, q.x]  — pがwaypointの時のみ移動可
      if(i>0){

        const dist=Math.hypot(dx,dy);
        const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
        const r=canvasRef.current.getBoundingClientRect();
        const z1=Math.min(4,Math.max(0.2,pr.startZoom*(dist/pr.startDist)));
        const f=z1/pr.startZoom;
        // ピンチ中心が startMid から現在の mid に移動 + ズーム補正
        const cx=pr.startMid.x-r.left, cy=pr.startMid.y-r.top;
        const nx=pr.startPan.x+(cx-pr.startPan.x)*(1-f)+(mid.x-pr.startMid.x);
        const ny=pr.startPan.y+(cy-pr.startPan.y)*(1-f)+(mid.y-pr.startMid.y);
        setZoom(z1); setPan({x:nx,y:ny});
      }
    };
    const onUp=e=>{
      const pr=pinchRef.current; if(!pr) return;
      pr.pointers.delete(e.pointerId);
      if(pr.pointers.size===0) pinchRef.current=null;
      else if(pr.pointers.size<2) pr.startDist=null;
    };
    document.addEventListener('pointermove',onMove);
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
    return()=>{document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);document.removeEventListener('pointercancel',onUp);};
  },[]);
  const updateNode=(id,props)=>{const newNodes=nodesRef.current.map(n=>n.id===id?{...n,props}:n);setNodes(newNodes);pushHist(newNodes,connsRef.current);};
  // サンプル構成を読み込む
  const loadSample=(sample)=>{
    const data=sample.build();
    // サンプル定義内に重複ID（過去JSON由来）が含まれていても安全に開けるよう、読込時に dedupe
    // 先にノード基準でカウンターを進めてから dedupe（再採番IDがノードIDと重ならないように）
    bumpGid(data.nodes,null);
    const cleanConns=dedupeConnIds(data.conns);
    setNodes(data.nodes);
    setConns(cleanConns);
    bumpGid(data.nodes,cleanConns);
    setSelected(null); setPEN(null);
    setPan({x:0,y:0}); setZoom(1);
    pushHist(data.nodes,data.conns);
    showToast(`${sample.label} を読み込みました`);
  };
  const updateConn=(id,patch)=>{const newConns=connsRef.current.map(c=>c.id===id?{...c,...patch}:c);setConns(newConns);pushHist(nodesRef.current,newConns);};

  // 削除前に残る配線の現在の形を中継点として固定する（他の配線の経路が変わらないようにするため）
  const freezeRemainingWires=(conns,nodes,removeIds)=>{
    if(wireStyle!=='ortho') return conns.filter(c=>!removeIds.includes(c.id));
    const prevSegs=[]; const result=[];
    for(const c of conns){
      const pts=connPts(c,nodes);
      if(!pts){ if(!removeIds.includes(c.id)) result.push(c); continue; }
      const cStyle=c.style||'ortho';
      const r=buildPath(pts,cStyle,nodes,c.fromNode,c.toNode,c.fromPort,c.toPort,prevSegs);
      prevSegs.push(...r.segs);
      if(removeIds.includes(c.id)) continue;
      // 中継点がない配線のみ、現在の角を中継点として保存
      if(!c.waypoints||c.waypoints.length===0){
        const rawC=r.segs.slice(0,-1).map(s=>({x:s.bx,y:s.by}));
        const corners=[];
        for(const cn of rawC){const l=corners[corners.length-1];if(!l||Math.abs(l.x-cn.x)>0.5||Math.abs(l.y-cn.y)>0.5)corners.push(cn);}
        result.push({...c,waypoints:corners});
      } else {
        result.push(c);
      }
    }
    return result;
  };

  const delSelected=()=>{
    if(!selected) return;
    const ns=nodesRef.current, cs=connsRef.current;
    let newNodes=ns, newConns;
    if(selected.type==='node'){
      const delNodeId=selected.id;
      // 削除対象ノードに接続された配線ID
      const removeWireIds=cs.filter(c=>c.fromNode===delNodeId||c.toNode===delNodeId).map(c=>c.id);
      newNodes=ns.filter(n=>n.id!==delNodeId);
      // 残る配線の形を保持しつつ削除対象の配線を除外
      newConns=freezeRemainingWires(cs,ns,removeWireIds);
      setNodes(newNodes);setConns(newConns);
    } else {
      newConns=freezeRemainingWires(cs,ns,[selected.id]);
      setConns(newConns);
    }
    setSelected(null);setPEN(null);
    pushHist(newNodes,newConns);
  };
  const clearAll=()=>{if(nodes.length===0&&conns.length===0)return;if(confirm('キャンバスをクリアしますか？')){setNodes([]);setConns([]);setSelected(null);setPEN(null);setIx(null);}};

  const ghostLine=useMemo(()=>{
    if(!ix||ix.mode!=='drawWire'||!ghostPos) return null;
    const startPort=portAbs(nodes,ix.nodeId,ix.portId);
    if(!startPort) return null;
    if(ix.clickMode){
      // クリックモード：カーソル位置を直前点に対して snap90 補正してプレビュー表示
      const wps=ix.waypoints||[];
      const prev=wps.length>0?wps[wps.length-1]:startPort;
      const snapped=snap90(prev,ghostPos);
      return{points:[startPort,...wps,snapped]};
    }
    return{p1:startPort,p2:ghostPos};
  },[ix,ghostPos,nodes]);

  const selConn=selected?.type==='conn'?conns.find(c=>c.id===selected.id):null;

  const portPreviewColor=useMemo(()=>{
    if(!portPreview) return'#ef4444';
    const node=nodes.find(n=>n.id===portPreview.nodeId); if(!node) return'#ef4444';
    const p=getNodePorts(node).find(p=>p.id===portPreview.portId);
    return p?.color||'#ef4444';
  },[portPreview,nodes]);

  const edgeHighlight=useMemo(()=>{
    if(!portPreview||!ix||ix.mode!=='movePort') return null;
    const node=nodes.find(n=>n.id===ix.nodeId); if(!node) return null;
    const {edge}=portPreview;
    const {w:nw,h:nh}=nodeEffSize(node);
    if(edge==='top')    return{left:node.x,top:node.y-2,width:nw,height:4};
    if(edge==='bottom') return{left:node.x,top:node.y+nh-2,width:nw,height:4};
    if(edge==='left')   return{left:node.x-2,top:node.y,width:4,height:nh};
    return                    {left:node.x+nw-2,top:node.y,width:4,height:nh};
  },[portPreview,ix,nodes]);

  return(
    <div style={{height:'100vh',display:'flex',flexDirection:'column'}}>
      <div className="hdr">
        <div>
          <div className="hdr-title">⚡ オフグリッド電気設計ツール</div>
          <div className="hdr-sub">キャンピングカー / トレーラー / オフグリッド</div>
        </div>
        {/* UNDO/REDO は左寄せ */}
        <div style={{display:'flex',gap:4,marginLeft:8}}>
          <button className="btn btn-outline" onClick={undo} disabled={!canUndo} title="元に戻す (Ctrl+Z)"
            style={{opacity:canUndo?1:0.35,fontSize:16,padding:'4px 9px'}}>↩</button>
          <button className="btn btn-outline" onClick={redo} disabled={!canRedo} title="やり直す (Ctrl+Y)"
            style={{opacity:canRedo?1:0.35,fontSize:16,padding:'4px 9px'}}>↪</button>
        </div>
        <div className="hdr-right">
          {/* 配線モード切替：クリック式デフォルト。自動モードは非表示（必要なら下記コメント解除） */}
          {/* <div style={{display:'flex',gap:2,marginRight:6}}>
            <button className={wireStyle==='ortho'?'btn btn-primary':'btn btn-outline'}
              style={{fontSize:11,padding:'4px 8px'}} title="自動直角ルーティング"
              onClick={()=>setWireStyle('ortho')}>自動</button>
            <button className={wireStyle==='click'?'btn btn-primary':'btn btn-outline'}
              style={{fontSize:11,padding:'4px 8px'}} title="クリックでウェイポイントを置く"
              onClick={()=>setWireStyle('click')}>クリック</button>
          </div> */}
          <span className="vlbl">電圧</span>
          <select className="volt-sel" value={systemV} onChange={e=>setSystemV(+e.target.value)}>
            <option value={12}>12V</option><option value={24}>24V</option><option value={48}>48V</option>
          </select>
          <div style={{width:1,height:20,background:'rgba(255,255,255,.15)',margin:'0 2px'}}/>
          <div className="file-menu-wrap">
            <button className="btn btn-outline" onClick={()=>setFileMenu(v=>!v)}>📁 ファイル ▾</button>
            {fileMenu&&<>
              <div className="file-menu-catch" onClick={()=>setFileMenu(false)}/>
              <div className="file-menu">
                <button onClick={()=>{setFileMenu(false);saveJSON();}}>💾 JSONで保存</button>
                <label style={{cursor:'pointer'}}>
                  📂 読込<input ref={loadRef} type="file" accept=".json" style={{display:'none'}} onChange={e=>{setFileMenu(false);loadJSON(e);}}/>
                </label>
                <button onClick={()=>{setFileMenu(false);exportPNG();}}>📤 PNG出力</button>
                <button onClick={()=>{setFileMenu(false);exportPDF();}}>📤 PDF出力</button>
                <button onClick={()=>{setFileMenu(false);shareLink();}}>🔗 共有リンクをコピー</button>
                <div className="file-menu-sep"/>
                <button onClick={()=>{setFileMenu(false);clearAll();}}>🗑 キャンバスをクリア</button>
                {!isDeployed&&<button onClick={()=>{setFileMenu(false);setShowSett(true);}}>⚙ 設定</button>}
              </div>
            </>}
          </div>
          <button className="btn btn-check" onClick={()=>setReview('check')}
            style={{display:'flex',alignItems:'center',gap:5}}>
            🔍 設計レビュー
            {checkBadge&&<span style={{background:'rgba(255,255,255,.2)',borderRadius:4,padding:'1px 5px',fontSize:11,fontWeight:700}}>{checkBadge.text}</span>}
          </button>
          <button className="btn btn-success" onClick={()=>setReview('bom')}>📋 部品一覧</button>
        </div>
      </div>

      <div className="body">
        {/* モバイル用パレット開閉 */}
        <button className="mobile-toggle pal-tog" onClick={()=>setPalOpen(v=>!v)}>{palOpen?'✕':'☰ 部品'}</button>
        {/* パネルが開いている時だけ閉じる×ボタンを表示（要素タップで自動展開するため設定ボタンは不要） */}
        {panOpen&&<button className="mobile-toggle pan-tog" onClick={()=>setPanOpen(false)}>✕</button>}
        {/* バックドロップ */}
        <div className={`modal-backdrop${palOpen||panOpen?' show':''}`} onClick={()=>{setPalOpen(false);setPanOpen(false);}}/>
        <Palette open={palOpen} onClose={()=>setPalOpen(false)}
          onTapPlace={type=>{
            // タッチ操作用：パレットアイテムをタップ → キャンバス中央付近に配置（重なり回避）
            const rect=canvasRef.current.getBoundingClientRect();
            const d=COMP[type];
            const wantX=Math.max(10,rect.width/2-d.w/2);
            const wantY=Math.max(10,rect.height/2-d.h/2);
            const{x,y}=findNonOverlapPos(wantX,wantY,d.w,d.h);
            const newNode={id:uid(),type,x,y,props:{...d.defaultProps},portPositions:{}};
            const newNodes=[...nodesRef.current,newNode];
            setNodes(newNodes);
            setSelected({type:'node',id:newNode.id});
            pushHist(newNodes,connsRef.current);
            // モバイル: 配置直後に設定パネルを自動展開
            if(window.innerWidth<=700) setTimeout(()=>openPanelForNode(newNode.id),100);
            showToast('配置しました');
          }}/>
        <div className="cvs-wrap" ref={canvasRef}
          onDragOver={onDragOver} onDrop={onDrop} onClick={onCanvasClick}
          onWheel={onCanvasWheel}
          onPointerDown={onCanvasPointerDown}
          style={{cursor:ix?.mode==='drawWire'?'crosshair':ix?.mode==='movePort'?'none':'default',touchAction:'none'}}>
          <div className="cvs-bg" style={{transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`,transformOrigin:'0 0',width:'400%',height:'400%',position:'absolute',top:0,left:0}}/>
          {/* ズームコントロール */}
          <div style={{position:'absolute',right:10,bottom:10,zIndex:60,display:'flex',gap:4,background:'rgba(255,255,255,0.9)',borderRadius:8,padding:4,boxShadow:'0 2px 6px rgba(0,0,0,0.15)'}}>
            <button className="btn btn-ghost btn-sm" style={{minWidth:28,padding:'4px 8px'}} title="縮小" onClick={()=>zoomAt(0.8,window.innerWidth/2,window.innerHeight/2)}>−</button>
            <button className="btn btn-ghost btn-sm" style={{minWidth:40,padding:'4px 8px',fontSize:11}} title="100%に戻す" onClick={()=>{setZoom(1);setPan({x:0,y:0});}}>{Math.round(zoom*100)}%</button>
            <button className="btn btn-ghost btn-sm" style={{minWidth:28,padding:'4px 8px'}} title="拡大" onClick={()=>zoomAt(1.25,window.innerWidth/2,window.innerHeight/2)}>+</button>
          </div>
          {/* ズーム/パン トランスフォーム層 */}
          <div className="cvs-xform" style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',transform:`translate(${pan.x}px,${pan.y}px) scale(${zoom})`,transformOrigin:'0 0'}}>

          {/* SVG connections */}
          <svg className="cvs-svg">
            {(()=>{
              // Pass 1: 全配線の経路と派生値を計算
              const wireData=conns.map(c=>{
                const pts=connPts(c,nodes); if(!pts) return null;
                const cStyle=c.style||wireStyle||'click';
                const r=buildPath(pts,cStyle,nodes,c.fromNode,c.toNode,c.fromPort,c.toPort,[]);
                const derived=getDerivedWire(c,nodes,conns,systemV,r.segs);
                // ショート回路チェック: 両端ポートの色から極性違反を検出
                const fn=nodes.find(n=>n.id===c.fromNode);
                const tn=nodes.find(n=>n.id===c.toNode);
                const fpc=fn?getNodePorts(fn).find(p=>p.id===c.fromPort)?.color:null;
                const tpc=tn?getNodePorts(tn).find(p=>p.id===c.toPort)?.color:null;
                const isShort=(fpc==='#ef4444'&&tpc==='#374151')||(fpc==='#374151'&&tpc==='#ef4444');
                const isMixed=(fpc==='#6366f1'&&(tpc==='#ef4444'||tpc==='#374151'))||(tpc==='#6366f1'&&(fpc==='#ef4444'||fpc==='#374151'));
                const danger=isShort?'short':(isMixed?'mixed':null);
                return{c,pts,path:r.path,segs:r.segs,warning:r.warning||!!danger,danger,derived};
              }).filter(Boolean);
              // Pass 2: ±ペア同期（両方 auto の時のみ大きい方に揃える）
              applyPolaritySync(wireData,nodes,conns,systemV);
              // Pass 3: 描画
              return wireData.map(({c,path,segs,warning,danger,derived})=>{
                const isSel=selected?.type==='conn'&&selected.id===c.id;
                const cStyle2=c.style||'ortho';
                // 再設定モード中：対象配線をグレー薄表示
                const isReplacing=ix?.mode==='drawWire'&&ix.replaceConnId===c.id;
                // ラベル位置: 実際に描画されている最長セグメントの中央（経路上に表示するため）
                let mid;
                if(segs&&segs.length>0){
                  let bestS=segs[0], bestL=0;
                  for(const s of segs){
                    const l=Math.hypot(s.bx-s.ax,s.by-s.ay);
                    if(l>bestL){bestL=l;bestS=s;}
                  }
                  mid={x:(bestS.ax+bestS.bx)/2,y:(bestS.ay+bestS.by)/2};
                } else {
                  mid=centroid(pts);
                }
                const col=c.wireColor||'#94a3b8';
                const thick=c.customThick!=null?c.customThick:wireThick(derived.wireSize);
                return(
                  <g key={c.id} style={{touchAction:'none',userSelect:'none',WebkitUserSelect:'none',pointerEvents:isReplacing?'none':undefined}}
                    onPointerDown={e=>{
                      // 長押し検出（500ms）→ 再設定/削除/キャンセル 3択モーダル
                      // 長押し成立まで段ドラッグも選択も発動しない
                      const sx=e.clientX,sy=e.clientY;
                      let longPressed=false;
                      const tid=setTimeout(()=>{
                        longPressed=true;
                        wireLongPressRef.current=c.id; // クリック抑制フラグ
                        const delWire=()=>{
                          const newConns=connsRef.current.filter(x=>x.id!==c.id);
                          setConns(newConns);
                          pushHist(nodesRef.current,newConns);
                          if(selected?.type==='conn'&&selected.id===c.id) setSelected(null);
                        };
                        const autoReset=()=>{
                          // 端点はそのまま、中継点だけクリアして自動ルーティングに戻す
                          const newConns=connsRef.current.map(x=>x.id===c.id?{...x,waypoints:[]}:x);
                          setConns(newConns);
                          pushHist(nodesRef.current,newConns);
                          showToast('自動再設定しました（中継点をクリア）');
                        };
                        setConfirmDlg({
                          title:'配線の操作',
                          message:'この配線をどうしますか？（経路を手動で変更したい時は削除して引き直してください）',
                          buttons:[
                            {label:'キャンセル',outline:true,onClick:null},
                            {label:'⚡ 自動で再設定',color:'#16a34a',onClick:autoReset},
                            {label:'🗑 削除',color:'#dc2626',onClick:delWire},
                          ]
                        });
                      },500);
                      const cleanup=()=>{clearTimeout(tid);document.removeEventListener('pointerup',cleanup);document.removeEventListener('pointermove',onMv);};
                      const onMv=ev=>{if(Math.abs(ev.clientX-sx)>6||Math.abs(ev.clientY-sy)>6){clearTimeout(tid);document.removeEventListener('pointermove',onMv);}};
                      document.addEventListener('pointerup',cleanup,{once:true});
                      document.addEventListener('pointermove',onMv);
                    }}
                    onClick={e=>{
                      e.stopPropagation();
                      // 長押し直後の click は抑制（誤操作防止）
                      if(wireLongPressRef.current===c.id){wireLongPressRef.current=null;return;}
                      setSelected({type:'conn',id:c.id});setPEN(null);
                      if(window.innerWidth<=700) setPanOpen(true);
                    }}
                    onDoubleClick={e=>{
                      e.stopPropagation();
                      const delWire=()=>{
                        const newConns=connsRef.current.filter(x=>x.id!==c.id);
                        setConns(newConns);
                        pushHist(nodesRef.current,newConns);
                        if(selected?.type==='conn'&&selected.id===c.id) setSelected(null);
                      };
                      const autoReset=()=>{
                        const newConns=connsRef.current.map(x=>x.id===c.id?{...x,waypoints:[]}:x);
                        setConns(newConns);
                        pushHist(nodesRef.current,newConns);
                        showToast('自動再設定しました（中継点をクリア）');
                      };
                      setConfirmDlg({
                        title:'配線の操作',
                        message:'この配線をどうしますか？（経路を手動で変更したい時は削除して引き直してください）',
                        buttons:[
                          {label:'キャンセル',outline:true,onClick:null},
                          {label:'⚡ 自動で再設定',color:'#16a34a',onClick:autoReset},
                          {label:'🗑 削除',color:'#dc2626',onClick:delWire},
                        ]
                      });
                    }}>
                    {/* Hit area */}
                    <path d={path} fill="none" stroke="transparent" strokeWidth={Math.max(14,thick+8)} style={{cursor:'move'}}/>
                    {/* Selection glow */}
                    {isSel&&<path d={path} fill="none" stroke="#3b82f6" strokeWidth={thick+8} strokeOpacity={0.18} style={{pointerEvents:'none'}}/>}
                    {/* Warning halo (経路解決失敗・部品貫通の可能性、点滅) */}
                    {warning&&<path d={path} fill="none" stroke="#ef4444" strokeWidth={thick+6} className="wire-warn-halo" style={{pointerEvents:'none'}}/>}
                    {/* Main wire */}
                    <path d={path} fill="none" stroke={isReplacing?'#94a3b8':(warning?'#ef4444':col)} strokeWidth={thick}
                      strokeLinecap={(cStyle2==='ortho'||cStyle2==='click')?'square':'round'}
                      strokeLinejoin={(cStyle2==='ortho'||cStyle2==='click')?'miter':'round'}
                      strokeDasharray={isReplacing?'8 4':(warning?'10 6':undefined)}
                      opacity={isReplacing?0.4:1}
                      className={warning?'wire-warn':undefined}/>
                    {/* Selection dash overlay */}
                    {isSel&&<path d={path} fill="none" stroke="#3b82f6" strokeWidth={1.5} strokeDasharray="8 5" style={{pointerEvents:'none'}}/>}
                    {/* Wire size label (派生値; 上書きがあれば上書き表示) */}
                    {derived.wireSize&&<>
                      <rect x={mid.x-26} y={mid.y-10} width={52} height={18} rx={4} fill="white" stroke={warning?'#ef4444':col} strokeWidth={1.5} fillOpacity={0.95}/>
                      <text x={mid.x} y={mid.y+3.5} textAnchor="middle" fontSize={9} fill={isSel?'#3b82f6':(warning?'#ef4444':col)} fontWeight={700}>{danger==='short'?'⚡ショート ':danger==='mixed'?'⚡AC/DC混在 ':warning?'⚠ ':''}{derived.wireSize}</text>
                    </>}
                  </g>
                );
              });
            })()}
            {ghostLine&&(ghostLine.points
              ?<>
                <path d={clickPath(ghostLine.points).path} fill="none" stroke="#94a3b8" strokeWidth={2} strokeDasharray="6 4" opacity={0.7}/>
                {ghostLine.points.slice(1,-1).map((p,i)=>(
                  <circle key={i} cx={p.x} cy={p.y} r={4} fill="#3b82f6" stroke="white" strokeWidth={1.5}/>
                ))}
              </>
              :<path d={buildPath([ghostLine.p1,ghostLine.p2],wireStyle).path} fill="none" stroke="#94a3b8" strokeWidth={2} strokeDasharray="6 4" opacity={0.7}/>
            )}
          </svg>

          {/* Nodes */}
          <div className="cvs-nodes">
            {nodes.map(n=>(
              <NodeEl key={n.id} node={n}
                selected={selected?.type==='node'&&selected.id===n.id}
                isPortEdit={portEditNode===n.id}
                drawingWire={ix?.mode==='drawWire'?ix:null}
                onMouseDown={onNodeMouseDown}
                onPortMouseDown={onPortMouseDown}
                onPortMouseUp={onPortMouseUp}
                onResizeStart={onResizeMouseDown}
                onDelete={id=>{
                  const ns=nodesRef.current, cs=connsRef.current;
                  const removeIds=cs.filter(c=>c.fromNode===id||c.toNode===id).map(c=>c.id);
                  const nn=ns.filter(n=>n.id!==id);
                  const nc=freezeRemainingWires(cs,ns,removeIds);
                  setNodes(nn);setConns(nc);setSelected(null);setPEN(null);pushHist(nn,nc);
                }}
              />
            ))}
          </div>

          {/* Handles overlay */}
          <div className="cvs-handles">
            {edgeHighlight&&<div className="edge-hl" style={{position:'absolute',...edgeHighlight}}/>}
            {portPreview&&(()=>{
              const node=nodes.find(n=>n.id===portPreview.nodeId); if(!node) return null;
              return<div className="port-ghost" style={{left:node.x+portPreview.px,top:node.y+portPreview.py,background:portPreviewColor}}/>;
            })()}
          </div>

          {nodes.length===0&&(
            <div className="empty">
              <div className="empty-ico">⚡</div>
              <div className="empty-t">サンプル構成から始める</div>
              <div className="empty-s">代表的な構成を選んで読み込めます</div>
              <div className="sample-grid">
                {SAMPLES.map(s=>(
                  <div key={s.key} className="sample-card" onClick={()=>loadSample(s)}>
                    <div className="sample-card-title">{s.label}</div>
                    <div className="sample-card-desc">{s.desc}</div>
                    <div className="sample-card-spec">{s.spec}</div>
                  </div>
                ))}
              </div>
              <div className="empty-s" style={{marginTop:16,fontSize:11.5}}>または、左のパレットから部品をドラッグして<br/>ゼロから配線図を作成できます</div>
            </div>
          )}
          </div>{/* /cvs-xform */}
        </div>

        <PropPanel selected={selected} nodes={nodes} connections={conns} systemV={systemV} wireStyle={wireStyle}
          portEditNode={portEditNode} setPEN={setPEN}
          onUpdateNode={updateNode} onUpdateConn={updateConn} onDelSelected={delSelected} onResizeNode={resizeNode} onRotateNode={rotateNode} onChangeBusPortCount={changeBusPortCount}
          open={panOpen}/>
      </div>

      {review&&<ReviewModal nodes={nodes} connections={conns} affiliateTag={affTag} systemV={systemV} initialTab={review} onClose={()=>setReview(null)}/>}
      {showSett&&!isDeployed&&<SettModal affiliateTag={affTag} onSave={v=>{setAffTag(v);localStorage.setItem('aff_tag',v);}} onClose={()=>setShowSett(false)}/>}
      {toast&&<div className="toast">{toast}</div>}
      {confirmDlg&&(
        <div style={{position:'fixed',inset:0,background:'rgba(15,23,42,0.5)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center'}}
          onClick={()=>setConfirmDlg(null)}>
          <div style={{background:'white',borderRadius:12,padding:'20px 24px',minWidth:280,maxWidth:'90vw',boxShadow:'0 10px 30px rgba(0,0,0,0.25)'}}
            onClick={e=>e.stopPropagation()}>
            {confirmDlg.title&&<div style={{fontSize:15,fontWeight:700,marginBottom:10,color:'#0f172a'}}>{confirmDlg.title}</div>}
            <div style={{fontSize:14,color:'#334155',marginBottom:18,lineHeight:1.6}}>{confirmDlg.message}</div>
            <div style={{display:'flex',justifyContent:'flex-end',gap:8,flexWrap:'wrap'}}>
              {confirmDlg.buttons?confirmDlg.buttons.map((b,i)=>(
                <button key={i} className={b.outline?'btn btn-outline':'btn btn-primary'}
                  style={{padding:'6px 14px',...(b.color?{background:b.color,borderColor:b.color}:{})}}
                  onClick={()=>{const fn=b.onClick;setConfirmDlg(null);if(fn)fn();}}>{b.label}</button>
              )):<>
                <button className="btn btn-outline" style={{padding:'6px 14px'}} onClick={()=>setConfirmDlg(null)}>キャンセル</button>
                <button className="btn btn-primary" style={{padding:'6px 14px'}} onClick={()=>{const fn=confirmDlg.onOk;setConfirmDlg(null);if(fn)fn();}}>OK</button>
              </>
            }
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
